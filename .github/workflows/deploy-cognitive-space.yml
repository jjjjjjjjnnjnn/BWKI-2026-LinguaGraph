# Deploy CognitiveSpace 3D Visualization + Research Portal to GitHub Pages
name: Deploy CognitiveSpace

on:
  push:
    branches: [master]
    paths:
      - 'cognitive-space/**'
      - 'README.md'
      - 'README_DE.md'
      - 'README_ZH.md'
      - 'sync_readmes.py'
      - '_deploy/**'
      - 'docs/**'
      - 'outputs/**'
      - 'scripts/figures/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment bundle
        run: |
          mkdir -p _deploy
          cp -r cognitive-space/web/* _deploy/
          mkdir -p _deploy/web
          cp -r cognitive-space/web/* _deploy/web/
          cp -r cognitive-space/portal _deploy/portal
          cp -r cognitive-space/vendor _deploy/vendor
          cp -r docs _deploy/docs
          cp README.md README_DE.md README_ZH.md _deploy/ 2>/dev/null || true
          # Dev-only files must not ship to Pages (B6 2026-09-13):
          rm -f _deploy/sync_readmes.py _deploy/portal/fix_portal.py _deploy/portal/fix_bugs.txt
          # Fix _deploy README screenshot path (no _deploy/cognitive-space/ tree):
          sed -i 's|"cognitive-space/web/screenshot.png"|"web/screenshot.png"|g' _deploy/README.md _deploy/README_DE.md _deploy/README_ZH.md
          # Site root serves the portal (same rule as scripts/mirror_root.py):
          # flatten one-level ../x refs to x for the root copy.
          cp cognitive-space/portal/index.html _deploy/index.html
          sed -i "s|'../web/index.html'|'web/index.html'|g" _deploy/index.html
          sed -i 's|"../web/|"web/|g' _deploy/index.html
          sed -i 's|"../figures/|"figures/|g' _deploy/index.html
          sed -i 's|"../docs/|"docs/|g' _deploy/index.html
          sed -i 's|"../portal/|"portal/|g' _deploy/index.html
          sed -i 's|"../vendor/|"vendor/|g' _deploy/index.html
          sed -i 's|"../index.html"|"web/index.html"|g' _deploy/index.html
          # Double-up ../../docs refs (paper section): root copy -> docs/,
          # /portal/ subdir copy (verbatim cp from source) -> ../docs/.
          sed -i 's|"../../docs/|"docs/|g' _deploy/index.html
          sed -i 's|"../../docs/|"../docs/|g' _deploy/portal/index.html
          echo "Deployment bundle contents:"
          find _deploy -maxdepth 2 -type f | head -40

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
