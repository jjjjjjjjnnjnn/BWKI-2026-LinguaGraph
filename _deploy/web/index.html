    <script>
    (() => {
    'use strict';

    /* ═══════════════════════════════════════════════════════════════
       CognitiveSpace — 3D Math Knowledge Graph
       Architecture: Pure 3d-force-graph API, no direct THREE refs.
       View modes, BFS ripple, language filtering.
       ═══════════════════════════════════════════════════════════════ */

    const LV = {
        elementary: { c:'#1e7e4d', l:'Elementary' },
        middle:     { c:'#0e7490', l:'Middle' },
        high:       { c:'#1e3a8a', l:'High' },
        college:    { c:'#6d28d9', l:'College' },
    };
    const MT = { universe:'UNIVERSE', spacefill:'SPACE-FILL', compare:'COMPARE' };
    /* STEAM fused graph — state only read when graph==='steam' (zero regression otherwise) */
    const DISC_C = { math:'#1e3a8a', physics:'#ea580c', chemistry:'#15803d' };
    let steamVis = { math:true, physics:true, chemistry:true };
    let steamColorMode = 'level'; // 'level' (legacy default) | 'discipline'
    let STEAM_FULL_N = [], STEAM_FULL_L = [], STEAM_DISC = new Map();

    let G, ND=[], LK=[], ADJ=new Map();
    let mode='universe', graph='math', rT=null, _autoRotate=false, _wasd=true;
    let lastNode=null; // currently open detail card (for UI-language hot re-render)

    /* ─── Graph registry (math + physics share one viewer) ────── */
    const GRAPHS = {
        math: { data: () => (typeof COGNITIVE_DATA_EXT !== 'undefined' ? COGNITIVE_DATA_EXT : (typeof COGNITIVE_DATA !== 'undefined' ? COGNITIVE_DATA : null)) },
        physics: { data: () => (typeof data_physics !== 'undefined' ? data_physics : null) },
        chemistry: { data: () => (typeof data_chemistry !== 'undefined' ? data_chemistry : null) },
        steam: { data: () => (typeof data_steam !== 'undefined' ? data_steam : null) },
    };
    /* STEAM helpers (pure 3d-force-graph API; no THREE refs) */
    function steamLinkEnds(l){
        const s = (l.source && typeof l.source==='object') ? l.source.id : l.source;
        const t = (l.target && typeof l.target==='object') ? l.target.id : l.target;
        return [s, t];
    }
    function steamVisible(){
        const vis = steamVis;
        const nodes = STEAM_FULL_N.filter(n => vis[n.discipline || 'math']);
        const ids = new Set(nodes.map(n => n.id));
        const links = STEAM_FULL_L.filter(l => {
            const se = steamLinkEnds(l);
            if (!ids.has(se[0]) || !ids.has(se[1])) return false;
            return true;
        });
        return { nodes, links };
    }
    function steamDensity(V, E){ return V > 1 ? (2*E/(V*(V-1))) : 0; }
    function linkColorCB(l) {
        return l && l.inferred ? '#b9c7d8' : '#7aa3c8';
    }
    function linkWidthCB(l) { return 0.35; }
    function updateSteamUI(){
        const on = (graph === 'steam');
        ['steamToggles','steamColor','steamPanel'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = on ? '' : 'none';
        });
        document.querySelectorAll('.leg-steam').forEach(el => { el.style.display = on ? '' : 'none'; });
        document.querySelectorAll('#steamToggles input[type=checkbox]').forEach(cb => { cb.checked = !!steamVis[cb.value]; });
        const cb2 = document.getElementById('steamColorBtn');
        if (cb2) { cb2.textContent = i18n.tr(steamColorMode === 'discipline' ? 'steam.color.disc' : 'steam.color.level'); cb2.classList.toggle('a', steamColorMode === 'discipline'); }
    }
    function refreshSteamPanel(){
        const el = document.getElementById('steamPanel');
        if (!el || graph !== 'steam') return;
        const disp = steamVisible();
        const nodes = disp.nodes, links = disp.links;
        const discs = ['math','physics','chemistry'];
        const dname = d => i18n.tr('disc.'+d);
        let html = '<div class="sp-title">'+i18n.tr('steam.panel')+'</div>';
        discs.forEach(d => {
            const V = nodes.filter(n => (n.discipline||'math') === d).length;
            const E = links.filter(l => (l.discipline||'') === d).length;
            const hidTag = steamVis[d] ? '' : ' <span style="color:#b45309">'+i18n.tr('steam.hidden')+'</span>';
            html += '<div class="sp-row"><span class="sp-dot" style="background:'+DISC_C[d]+'"></span><span>'+dname(d)+'</span>'+
                '<span class="sp-num">'+V+' '+i18n.tr('steam.nodes')+' · '+E+' '+i18n.tr('steam.edges')+' · '+i18n.tr('steam.density')+' '+steamDensity(V,E).toFixed(4)+hidTag+'</span></div>';
        });
        const lvOrder = ['elementary','middle','high','college'];
        const lvCounts = {}; lvOrder.forEach(lv => lvCounts[lv] = nodes.filter(n => (n.level||'college')===lv).length);
        let maxLv = 1;
        lvOrder.forEach(lv => { if (lvCounts[lv] > maxLv) maxLv = lvCounts[lv]; });
        html += '<div class="sp-sec">'+i18n.tr('steam.levels')+'</div>';
        lvOrder.forEach(lv => {
            const pct = (100 * lvCounts[lv] / maxLv).toFixed(1);
            html += '<div class="sp-row"><span style="width:52px;flex:none">'+i18n.tr('level.'+lv)+'</span>'+
                '<div style="flex:1;background:#e7ebef;border-radius:3px"><div class="sp-bar" style="width:'+pct+'%;background:'+(LV[lv]||LV.college).c+'"></div></div>'+
                '<span class="sp-num">'+lvCounts[lv]+'</span></div>';
        });
        html += '<div class="sp-sec">Findings</div>'+
            '<div class="sp-row"><span><a href="../portal/index.html#finding-a-content" target="_blank" rel="noopener">'+i18n.tr('finding.a')+'</a> · '+
            '<a href="../portal/index.html#finding-b" target="_blank" rel="noopener">'+i18n.tr('finding.b')+'</a></span></div>';
        el.innerHTML = html;
    }
    function applySteamFilter(){
        if (graph !== 'steam' || !G) return;
        const disp = steamVisible();
        hideDetail(); clearRipple();
        buildAdjFrom(disp.nodes, disp.links);
        document.getElementById('sC').textContent = disp.nodes.length;
        document.getElementById('sR').textContent = disp.links.length;
        document.getElementById('sL').textContent = new Set(disp.nodes.map(n=>n.level||'')).size;
        setMode(mode);
        refreshSteamPanel();
    }
    function steamRecolor(){
        if (graph !== 'steam' || !G) return;
        STEAM_FULL_N.forEach(n => { n.color = colorCB(n); });
        const disp = steamVisible();
        G.nodeColor('color').graphData({ nodes: disp.nodes, links: disp.links });
    }
    function switchGraph(g, pushState) {
        if (!GRAPHS[g] || !G) return;
        const d = GRAPHS[g].data();
        if (!d || !d.nodes || !d.nodes.length) return;
        graph = g;
        ND = d.nodes; LK = d.links;
        assignAnchors(ND);
        if (g === 'steam') {
            STEAM_FULL_N = ND; STEAM_FULL_L = LK;
            STEAM_DISC = new Map(ND.map(n => [n.id, n.discipline || 'math']));
            const disp0 = steamVisible();
            document.getElementById('sC').textContent = disp0.nodes.length;
            document.getElementById('sR').textContent = disp0.links.length;
            document.getElementById('sL').textContent = new Set(disp0.nodes.map(n=>n.level||'')).size;
        } else {
            document.getElementById('sC').textContent = ND.length;
            document.getElementById('sR').textContent = LK.length;
            document.getElementById('sL').textContent = new Set(ND.map(n=>n.level||'')).size;
        }
        document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('a', x.dataset.d === g));
        document.getElementById('search').value = '';
        document.getElementById('searchMeta').innerHTML = '';
        hideDetail(); clearRipple();
        if (g === 'steam') { const disp = steamVisible(); buildAdjFrom(disp.nodes, disp.links); }
        else buildAdj();
        updateSteamUI();
        setMode(mode);
        refreshAbout();
        refreshSteamPanel();
        try { if (pushState !== false && window.history && history.replaceState) history.replaceState(null, '', g === 'math' ? location.pathname : '?graph=' + g); } catch(e) {}
    }

    /* ─── Init ────────────────────────────────────────────────────── */
    function init() {
        // Check dependencies
        if (typeof ForceGraph3D === 'undefined') {
            document.getElementById('loadErr').textContent = ''+i18n.tr('error.load')+'';
            document.getElementById('loadErr').style.display = 'block';
            return;
        }

        const data = typeof COGNITIVE_DATA_EXT !== 'undefined' ? COGNITIVE_DATA_EXT :
                     typeof COGNITIVE_DATA !== 'undefined' ? COGNITIVE_DATA : null;
        if (!data || !data.nodes || !data.nodes.length) {
            document.getElementById('loadErr').textContent = ''+i18n.tr('error.data')+'';
            document.getElementById('loadErr').style.display = 'block';
            return;
        }

        ND = data.nodes; LK = data.links;
        document.getElementById('sC').textContent = ND.length;
        document.getElementById('sR').textContent = LK.length;
        document.getElementById('sL').textContent = new Set(ND.map(n=>n.level||'')).size;
        document.getElementById('sub').textContent = i18n.tr('hud.subtitle', {concepts: ND.length, relations: LK.length});

        buildAdj();
        mkGraph();
        mkUI();
        i18n.apply();
        // i18n.detect() already follows browser on first visit; just sync widgets
        refreshAbout(); refreshModeCap(); window.__paintWasd();
        document.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('a', x.dataset.u === i18n.lang));
        // Deep link: ?graph=physics / ?graph=chemistry
        try {
            const q = new URLSearchParams(location.search).get('graph');
            if (q === 'physics' || q === 'chemistry' || q === 'steam') switchGraph(q, false);
        } catch(e) {}

        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
            setTimeout(() => {
                const e = document.getElementById('loading');
                if (e) e.style.display = 'none';
            }, 800);
        }, 600);
    }

    /* ─── Adjacency ───────────────────────────────────────────────── */
    function buildAdj() { buildAdjFrom(ND, LK); }
    function buildAdjFrom(nodes, links) {
        ADJ.clear();
        nodes.forEach(n => ADJ.set(n.id, new Set()));
        links.forEach(l => {
            const se = (typeof steamLinkEnds === 'function') ? steamLinkEnds(l) : null;
            const s = se ? se[0] : (typeof l.source==='object' ? l.source.id : l.source);
            const t = se ? se[1] : (typeof l.target==='object' ? l.target.id : l.target);
            if (ADJ.has(s) && ADJ.has(t)) { ADJ.get(s).add(t); ADJ.get(t).add(s); }
        });
    }

    /* ─── Graph ───────────────────────────────────────────────────── */
    // Callback functions shared between mkGraph() and setMode()
    // Defined here so both can access them (JavaScript scope)
    function colorCB(n) {
        if (n._r != null) {
            const d = n._r;
            return d === 0 ? '#1e3a8a' : d === 1 ? '#0e7490' : d === 2 ? '#b45309' : '#c6cdd6';
        }
        if (n._h) return '#dbe2ea';
        if (graph === 'steam' && steamColorMode === 'discipline' && DISC_C[n.discipline]) return DISC_C[n.discipline];
        return (LV[n.level] || LV.college).c;
    }
    function opacityCB(n) {
        if (n._r != null) return n._r === 0 ? 1 : n._r === 1 ? .85 : n._r === 2 ? .5 : .25;
        if (n._h) return .02;
        return 1;
    }
    function degreeOf(id){ const s = ADJ.get(id); return s ? s.size : 0; }
    // Node size = degree (connections). Compare mode adds a trilingual bonus.
    // Node size = degree (connections) in every mode; modes differ by geometry.
    function sizeVal(n){
        const d = degreeOf(n.id);
        return 2 + d * 2.2;
    }
    function valCB(n) { return sizeVal(n); }

    /* ─── Deterministic hash ──────────────────────────────────────────── */
    function hashStr(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash = hash & hash;
        }
        return Math.abs(hash);
    }

    /* ─── Shell radii + cluster layout (auto-fit to the live graph) ── */
    // Old build used math-tuned constants; radii are now derived from the
    // current graph's level distribution so physics/chemistry fit as well.
    const LV_ORDER = ['elementary','middle','high','college'];
    function computeShells(nodes){
        const counts = {elementary:0, middle:0, high:0, college:0};
        nodes.forEach(n => { counts[n.level || 'college']++; });
        const S = {}; let r = 0;
        LV_ORDER.forEach(l => {
            const band = counts[l] ? Math.max(30, 300 * counts[l] / (nodes.length || 1)) : 0;
            S[l] = { minR: r, maxR: r + band };
            r += band + 14;
        });
        return S;
    }
    function shellPos(n, S){
        const shell = (S && S[n.level || 'college']) || { minR: 250, maxR: 320 };
        const h = hashStr(n.id);
        const span = Math.max(shell.maxR - shell.minR, 1);
        const r = shell.minR + (h % 1001) / 1000 * span;
        const theta = (h % 997) / 997 * Math.PI * 2;
        const phi = Math.acos(2 * (((h * 13 + 7) % 1000) / 1000) - 1);
        return { x: r * Math.sin(phi) * Math.cos(theta), y: r * Math.sin(phi) * Math.sin(theta), z: r * Math.cos(phi) };
    }
    // Compare mode: one pinned ball per education level (tetrahedral layout)
    const CLUSTER_DIR = { elementary:[1,1,1], middle:[1,-1,-1], high:[-1,1,-1], college:[-1,-1,1] };
    function clusterPos(n, counts){
        const dir = CLUSTER_DIR[n.level || 'college'] || CLUSTER_DIR.college;
        const len = Math.sqrt(dir[0]*dir[0] + dir[1]*dir[1] + dir[2]*dir[2]);
        const R = 235, h = hashStr(n.id + '|c');
        const jr = 30 + 2.4 * Math.sqrt(counts[n.level || 'college'] || 1);
        const rr = (h % 1001) / 1000 * jr;
        const th = (h % 997) / 997 * Math.PI * 2;
        const ph = Math.acos(2 * (((h * 13 + 7) % 1000) / 1000) - 1);
        return {
            x: dir[0]/len*R + rr*Math.sin(ph)*Math.cos(th),
            y: dir[1]/len*R + rr*Math.sin(ph)*Math.sin(th),
            z: dir[2]/len*R + rr*Math.cos(ph)
        };
    }
    function assignAnchors(nodes){
        const S = computeShells(nodes);
        nodes.forEach(n => {
            const p = shellPos(n, S);
            n.x = p.x; n.y = p.y; n.z = p.z;
            n.sx = p.x; n.sy = p.y; n.sz = p.z;
        });
        return S;
    }

    function mkGraph() {
        assignAnchors(ND);
        ND.forEach(n => {
            n.color = colorCB(n);
            n.val = sizeVal(n);
        });

        G = ForceGraph3D()(document.getElementById('graph-container'))
            .nodeColor('color')
            .nodeVal('val')
            .nodeLabel(n => nodeLabel(n))
            .nodeResolution(16)
            .nodeRelSize(8)
            .linkColor(linkColorCB)
            .linkWidth(linkWidthCB)
            .linkOpacity(0.35)
            .linkDirectionalParticles(0)
            .backgroundColor('#f1f3f5')
            .showNavInfo(false)
            .width(innerWidth)
            .height(innerHeight)
            .graphData({ nodes: ND, links: LK });
        window.G = G;

        G.onNodeClick(n => { showDetail(n); ripple(n); });
        G.onBackgroundClick(() => { hideDetail(); clearRipple(); });
        // V2: Isometric view to show spherical shell structure
        G.cameraPosition({ x: 450, y: 200, z: 300 }, { x: 0, y: 0, z: 0 }, 0);
        window.addEventListener('resize', () => { G.width(innerWidth); G.height(innerHeight); });

        // ── WASD keyboard controls ──
        const keys = {};
        document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

        // ── onEngineTick: lighting + WASD + breathing ──
        let _lightsBoosted = false;
        G.onEngineTick(() => {
            const cam = G.camera();
            if (!cam) return;

            // Boost scene lighting (once) — tuned for porcelain background
            if (!_lightsBoosted) {
                const scene = G.scene();
                if (scene) {
                    scene.children.forEach(c => {
                        if (c.type === 'AmbientLight' || (c.constructor && c.constructor.name === 'AmbientLight')) {
                            c.intensity = 1.6;
                            c.color.setHex(0xffffff);
                        }
                        if (c.type === 'DirectionalLight' || (c.constructor && c.constructor.name === 'DirectionalLight')) {
                            c.intensity = 1.2;
                            c.color.setHex(0xffffff);
                        }
                        if (c.type === 'HemisphereLight' || (c.constructor && c.constructor.name === 'HemisphereLight')) {
                            c.intensity = 1.0;
                        }
                    });
                    _lightsBoosted = true;
                }
            }

            // WASD movement (toggleable; ignored while typing in search)
            if (_wasd && document.activeElement && document.activeElement.id !== 'search') {
            cam.updateMatrixWorld();
            const e = cam.matrixWorld.elements;
            const fx = -e[8], fy = -e[9], fz = -e[10];
            const rx = e[0], ry = e[1], rz = e[2];
            const spd = 3.0;

            let dx = 0, dy = 0, dz = 0;
            if (keys['w'] || keys['arrowup'])    { dx += fx; dy += fy; dz += fz; }
            if (keys['s'] || keys['arrowdown'])   { dx -= fx; dy -= fy; dz -= fz; }
            if (keys['a'] || keys['arrowleft'])   { dx -= rx; dy -= ry; dz -= rz; }
            if (keys['d'] || keys['arrowright'])  { dx += rx; dy += ry; dz += rz; }
            if (keys['q']) dy -= 1;
            if (keys['e']) dy += 1;

            const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (len > 0.001) {
                cam.position.x += (dx / len) * spd;
                cam.position.y += (dy / len) * spd;
                cam.position.z += (dz / len) * spd;
            }
            } // end _wasd guard

            // Auto-rotate around Y axis (toggle with [Auto Rotate] button)
            if (_autoRotate) {
                const cx = cam.position.x, cz = cam.position.z;
                const angle = 0.003;
                cam.position.x = cx * Math.cos(angle) - cz * Math.sin(angle);
                cam.position.z = cx * Math.sin(angle) + cz * Math.cos(angle);
                cam.lookAt(0, 0, 0);
            }

            // Breathing animation: gentle ±4% pulse on degree-based sizes
            // (sizeVal reads live mode — no stale cache across mode switches)
            const t = Date.now() * 0.001;
            const pulse = 1.0 + 0.04 * Math.sin(t * Math.PI);
            const gd = G.graphData();
            if (gd && gd.nodes) {
                gd.nodes.forEach(n => { n.val = sizeVal(n) * pulse; });
            }

        });
    }

    /* ─── Ripple ──────────────────────────────────────────────────── */
    function ripple(node) {
        clearRipple();
        const id = node.id, gd = G.graphData();
        if (!gd) return;
        const dist = new Map(), q = [{i:id,d:0}], vs = new Set([id]);
        while (q.length) {
            const {i,d} = q.shift(); dist.set(i,d);
            if (d<5) (ADJ.get(i)||[]).forEach(nid => { if (!vs.has(nid)) { vs.add(nid); q.push({i:nid,d:d+1}); } });
        }
        gd.nodes.forEach(n => { n._r = dist.has(n.id)?dist.get(n.id):99; n._h = false; });
        document.getElementById('rbtn').style.display = 'block';
        if (rT) clearTimeout(rT);
        rT = setTimeout(clearRipple, 5000);

        // Create diffusion ring animation at click position
        createRippleRing(node);
    }

    function createRippleRing(node) {
        // Project 3D position to 2D screen coordinates
        const canvas = document.querySelector('#graph-container canvas');
        if (!canvas) return;

        const camera = G.camera();
        const pos = node;
        if (!camera || pos.x == null) return;

        // Simple 3D to 2D projection
        const width = canvas.width;
        const height = canvas.height;
        const aspect = width / height;

        // Project to normalized device coordinates
        const z = pos.z || 0;
        const x = pos.x || 0;
        const y = pos.y || 0;

        // Scale based on camera distance
        const scale = 200 / (200 + z);
        const screenX = (x * scale * aspect + 1) * width / 2;
        const screenY = (-y * scale + 1) * height / 2;

        // Create ring element
        const ring = document.createElement('div');
        ring.className = 'ripple-ring';
        ring.style.left = screenX + 'px';
        ring.style.top = screenY + 'px';
        document.body.appendChild(ring);

        // Remove after animation
        setTimeout(() => ring.remove(), 1200);
    }
    function clearRipple() {
        // Reset ripple state on both current and full datasets
        const gd = G && G.graphData();
        if (gd && gd.nodes) gd.nodes.forEach(n => { n._r = null; });
        ND.forEach(n => { n._r = null; });
        document.getElementById('rbtn').style.display = 'none';
    }

    /* ─── Detail ──────────────────────────────────────────────────── */
    // Concept group label (localized; falls back to the raw group id)
    function groupName(g){
        g = g || 'general';
        const t = i18n.tr('group.'+g);
        return (t && t.charAt(0) !== '[') ? t : g;
    }
    // Every node is trilingual, so counts never change with language.
    // STEAM mode prefixes a discipline badge that follows the UI language.
    function nodeLabel(n){
        const lbs = (n && n.labels) || {};
        const l = (typeof i18n !== 'undefined' && i18n.lang) || 'en';
        const base = lbs[l] || n.name || n.id;
        if (graph === 'steam' && n && n.discipline) {
            const B = { math:{en:'[M]',de:'[M]',zh:'[数]'}, physics:{en:'[P]',de:'[Ph]',zh:'[物]'}, chemistry:{en:'[C]',de:'[Ch]',zh:'[化]'} };
            const b = ((B[n.discipline] || {})[l]) || ((B[n.discipline] || {}).en) || '';
            if (b) return b + ' ' + base;
        }
        return base;
    }
    function showDetail(n) {
        lastNode = n;
        const e = document.getElementById('detail');
        document.getElementById('dn').textContent = nodeLabel(n);
        const lbs = n.labels||{};
        document.getElementById('dl').innerHTML = ['zh','en','de']
            .filter(l=>lbs[l]).map(l=>'<span style="margin:0 2px">'+l.toUpperCase()+': '+lbs[l]+'</span>').join('');
        const lv = n.level||'college', lc = LV[lv]||LV.college;
        document.getElementById('dm').innerHTML = '<span style="color:'+lc.c+'">'+i18n.tr('level.'+lv)+'</span> · '+groupName(n.group)+' · '+((n.source_count||1)+' '+i18n.tr('sources'));

        // ── Compute node-level metrics ──
        const gd = G.graphData();
        let connections = 0, neighbors = [];
        if (gd) {
            const id = n.id;
            gd.links.forEach(l => {
                const s = typeof l.source==='object'?l.source.id:l.source;
                const t = typeof l.target==='object'?l.target.id:l.target;
                if (s===id || t===id) {
                    connections++;
                    const oid = s===id ? t : s;
                    const on = gd.nodes.find(nn=>nn.id===oid);
                    if (on) neighbors.push(nodeLabel(on));
                }
            });
        }

        // HDS depth (prerequisite chain)
        let hdsDepth = 0;
        if (gd) {
            const adj = {};
            gd.nodes.forEach(nn => adj[nn.id] = new Set());
            gd.links.forEach(l => {
                const s = typeof l.source==='object'?l.source.id:l.source;
                const t = typeof l.target==='object'?l.target.id:l.target;
                if ((l.type||'')==='prerequisite'||(l.type||'')==='requires') { adj[s].add(t); }
            });
            const visited = new Set([n.id]), queue = [{id:n.id,d:0}];
            while (queue.length) {
                const {id,d}=queue.shift(); hdsDepth=Math.max(hdsDepth,d);
                adj[id].forEach(nbid=>{if(!visited.has(nbid)){visited.add(nbid);queue.push({id:nbid,d:d+1});}});
            }
        }

        // Node role classification
        const avgDegree = gd ? (2 * gd.links.length / gd.nodes.length) : 6.2;
        let role = i18n.tr('role.intermediate'); let roleColor = '#60a5fa';
        if (hdsDepth >= 3) { role = i18n.tr('role.prerequisite_chain'); roleColor = '#22d3ee'; }
        else if (connections > avgDegree * 2) { role = i18n.tr('role.hub'); roleColor = '#f59e0b'; }
        else if (connections <= 2) { role = i18n.tr('role.peripheral'); roleColor = '#6b7280'; }

        // Auto-generated insight
        const lvOrder = {elementary:1, middle:2, high:3, college:4};
        const lev = lvOrder[lv]||3;
        let insight = '';
        if (role === i18n.tr('role.hub')) insight = i18n.tr('insight.hub');
        else if (role === i18n.tr('role.prerequisite_chain')) insight = i18n.tr('insight.chain', {depth: hdsDepth});

        // Render metrics

    }
    function hideDetail() { exitChainMode(); document.getElementById('detail').style.display = 'none'; }

    /* ─── Chain Walker (additive; directed prerequisite/requires BFS on rendered links) ─── */
    const chainState = { active:false, rootId:null, levels:[], flat:[], flatDepth:[], idx:0, showAll:false, prevAuto:null, prevColors:null, bound:false };
    // Directed adjacency restricted to prerequisite + requires (mirrors the HDS block in showDetail)
    function chainAdjacency(gd){
        const adj = {};
        gd.nodes.forEach(nn => { adj[nn.id] = []; });
        const seen = new Set();
        gd.links.forEach(l => {
            const s = typeof l.source==='object'?l.source.id:l.source;
            const t = typeof l.target==='object'?l.target.id:l.target;
            if (((l.type||'')==='prerequisite'||(l.type||'')==='requires') && adj[s] && adj[t] !== undefined) {
                const k = s+'>'+t;
                if (!seen.has(k)) { seen.add(k); adj[s].push(t); }
            }
        });
        return adj;
    }
    function chainBuildLevels(rootId, gd){
        const adj = chainAdjacency(gd);
        const visited = new Set([rootId]);
        let frontier = [rootId];
        const levels = [];
        while (frontier.length){
            const lvl = [], next = [];
            frontier.forEach(id => { (adj[id]||[]).forEach(nb => { if(!visited.has(nb)){ visited.add(nb); lvl.push(nb); next.push(nb); } }); });
            if (!lvl.length) break;
            levels.push(lvl);
            frontier = next;
        }
        return levels;
    }
    function chainNodeById(id){
        const gd = G && G.graphData ? G.graphData() : null;
        if (gd && gd.nodes){ for (let i=0;i<gd.nodes.length;i++) if (gd.nodes[i].id===id) return gd.nodes[i]; }
        for (let i=0;i<ND.length;i++) if (ND[i].id===id) return ND[i];
        return null;
    }
    function chainDepthOfIdx(){
        return (chainState.flatDepth.length && chainState.idx < chainState.flatDepth.length) ? chainState.flatDepth[chainState.idx] : chainState.levels.length;
    }
    // Camera flight reuses the focusNode() formula (same offset, same duration) — no new flight logic.
    function chainFlyTo(n){
        if (!G || !n || n.x == null) return;
        const r = Math.hypot(n.x || 0, n.y || 0, n.z || 0) || 200;
        const f = (r + 150) / r;
        G.cameraPosition({ x: (n.x || 0) * f, y: (n.y || 0) * f, z: (n.z || 0) * f },
            { x: n.x || 0, y: n.y || 0, z: n.z || 0 }, 900);
    }
    function chainPaintAutoBtn(){
        const ar = document.getElementById('arBtn');
        if (ar){ ar.dataset.ar = _autoRotate ? 'on' : 'off'; ar.classList.toggle('a', _autoRotate); }
    }
    function chainEnsureModeBinding(){
        if (chainState.bound) return;
        chainState.bound = true;
        // Mode switches rebake node colors inside setMode() — drop chain state without restoring stale colors.
        document.querySelectorAll('[data-m]').forEach(b => {
            b.addEventListener('click', () => {
                if (chainState.active){ chainState.active = false; chainState.prevColors = null; chainState.prevAuto = null; }
                if (lastNode) renderChainIntro(lastNode);
            });
        });
    }
    function chainEnterIfNeeded(){
        if (chainState.active) return;
        chainState.active = true;
        chainState.showAll = false;
        chainState.prevAuto = _autoRotate;
        if (_autoRotate){ _autoRotate = false; chainPaintAutoBtn(); }
    }
    // restore=true repaints pre-chain colors; mode switches pass false via the [data-m] hook (setMode already rebaked).
    function exitChainMode(restore){
        if (restore === undefined) restore = true;
        if (!chainState.active && !chainState.prevColors && chainState.prevAuto === null) return;
        if (restore) chainRestoreColors();
        chainState.prevColors = null;
        if (chainState.prevAuto !== null){ _autoRotate = chainState.prevAuto; chainPaintAutoBtn(); chainState.prevAuto = null; }
        chainState.active = false;
        chainState.showAll = false;
    }
    function chainRestoreColors(){
        const prev = chainState.prevColors;
        if (!prev) return;
        const gd = G && G.graphData ? G.graphData() : null;
        if (gd && gd.nodes) gd.nodes.forEach(n => { if (prev.has(n.id)) n.color = prev.get(n.id); });
        if (G) G.nodeColor('color');
    }
    function chainApplyHighlight(){
        const gd = G && G.graphData ? G.graphData() : null;
        if (!gd || !gd.nodes) return;
        if (!chainState.prevColors){
            chainState.prevColors = new Map();
            gd.nodes.forEach(n => chainState.prevColors.set(n.id, n.color));
        }
        const depth = chainState.showAll ? chainState.levels.length : chainDepthOfIdx();
        const inChain = new Set([chainState.rootId]);
        chainState.levels.slice(0, depth).forEach(lvl => lvl.forEach(id => inChain.add(id)));
        const curId = (!chainState.showAll && chainState.flat.length) ? chainState.flat[chainState.idx] : null;
        gd.nodes.forEach(n => {
            if (inChain.has(n.id)) n.color = (n.id === curId) ? '#f59e0b' : (chainState.prevColors.get(n.id) || colorCB(n));
            else n.color = '#e2e8f0';
        });
        G.nodeColor('color');
    }
    function chainTouchTimer(){
        const e = document.getElementById('detail');
        if (e){ clearTimeout(e._t); e._t = setTimeout(hideDetail, 20000); }
    }
    function chainGoto(i){
        if (!chainState.flat.length) return;
        chainEnterIfNeeded();
        chainState.showAll = false;
        chainState.idx = Math.max(0, Math.min(chainState.flat.length - 1, i));
        chainApplyHighlight();
        const n = chainNodeById(chainState.flat[chainState.idx]);
        if (n) chainFlyTo(n);
        renderChainUI();
        chainTouchTimer();
    }
    function chainSelectLevel(li){
        chainEnterIfNeeded();
        chainState.showAll = false;
        let target = 0;
        for (let i=0;i<chainState.flatDepth.length;i++){ if (chainState.flatDepth[i] === li + 1){ target = i; break; } }
        chainState.idx = target;
        chainApplyHighlight();
        const n = chainNodeById(chainState.flat[chainState.idx]);
        if (n) chainFlyTo(n);
        renderChainUI();
        chainTouchTimer();
    }
    function chainSelectComplete(){
        if (!chainState.flat.length) return;
        chainEnterIfNeeded();
        chainState.showAll = true;
        chainApplyHighlight();
        renderChainUI();
        chainTouchTimer();
    }
    function chainExitToIntro(){
        exitChainMode(true);
        renderChainUI();
        chainTouchTimer();
    }
    // Entry hook called at the end of showDetail(n) — renders only into #chainWalk.
    function renderChainIntro(n){
        chainEnsureModeBinding();
        const box = document.getElementById('chainWalk');
        if (!box || !G) return;
        if (chainState.active && chainState.rootId !== n.id){ exitChainMode(true); }
        if (!(chainState.active && chainState.rootId === n.id)){
            chainState.rootId = n.id;
            chainState.active = false;
            chainState.showAll = false;
            chainState.idx = 0;
            const gd = G.graphData();
            chainState.levels = gd ? chainBuildLevels(n.id, gd) : [];
            chainState.flat = [];
            chainState.flatDepth = [];
            chainState.levels.forEach((lvl, li) => lvl.forEach(id => { chainState.flat.push(id); chainState.flatDepth.push(li + 1); }));
        }
        renderChainUI();
    }
    function renderChainUI(){
        const box = document.getElementById('chainWalk');
        if (!box) return;
        const root = chainNodeById(chainState.rootId);
        if (!root || !chainState.levels.length){
            box.innerHTML = '<div class="cw-t">'+i18n.tr('detail.chain_title')+'</div>'+
                '<div class="cw-note">'+i18n.tr('detail.chain_note')+'</div>';
            return;
        }
        const total = chainState.flat.length;
        const effIdx = chainState.showAll ? total - 1 : chainState.idx;
        const curNode = chainNodeById(chainState.flat[effIdx]);
        const curLabel = curNode ? nodeLabel(curNode) : '';
        const cur = chainState.showAll ? total : (chainState.idx + 1);
        let chips = '';
        chainState.levels.forEach((lvl, li) => {
            const on = chainState.active && !chainState.showAll && chainDepthOfIdx() === li + 1;
            chips += '<button class="b cw-chip'+(on?' a':'')+'" data-cw-lvl="'+li+'">'+i18n.tr('detail.chain_chip', {n: li + 1})+'</button>';
        });
        chips += '<button class="b cw-chip'+(chainState.showAll?' a':'')+'" data-cw-all="1">'+i18n.tr('detail.chain_complete')+'</button>';
        const atStart = !chainState.showAll && chainState.idx <= 0;
        const atEnd = !chainState.showAll && chainState.idx >= total - 1;
        box.innerHTML = '<div class="cw-t">'+i18n.tr('detail.chain_title')+'</div>'+
            '<div class="cw-chips">'+chips+'</div>'+
            '<div class="cw-step">'+i18n.tr('detail.chain_step', {cur: cur, total: total, label: curLabel})+'</div>'+
            '<div class="cw-nav"><button class="b" data-cw-prev="1"'+(atStart?' disabled':'')+'>'+i18n.tr('detail.chain_prev')+'</button>'+
            '<button class="b" data-cw-next="1"'+(atEnd?' disabled':'')+'>'+i18n.tr('detail.chain_next')+'</button>'+
            '<button class="b" data-cw-exit="1">'+i18n.tr('detail.chain_exit')+'</button></div>'+
            '<div class="cw-note">'+i18n.tr('detail.chain_note')+'</div>';
        box.querySelectorAll('[data-cw-lvl]').forEach(b => b.addEventListener('click', () => chainSelectLevel(+b.getAttribute('data-cw-lvl'))));
        const all = box.querySelector('[data-cw-all]');
        if (all) all.addEventListener('click', chainSelectComplete);
        const pv = box.querySelector('[data-cw-prev]');
        if (pv) pv.addEventListener('click', () => chainGoto(chainState.idx - 1));
        const nx = box.querySelector('[data-cw-next]');
        if (nx) nx.addEventListener('click', () => chainGoto(chainState.idx + 1));
        const ex = box.querySelector('[data-cw-exit]');
        if (ex) ex.addEventListener('click', chainExitToIntro);
    }

    /* ─── View Mode ───────────────────────────────────────────────── */
    function setMode(m) {
        mode = m;
        document.getElementById('mode-tag').textContent = i18n.tr('mode.'+m);
        if (!G) return;

        // Dynamic view update: re-create graph data with mode-specific values
        // (lang is display-only since v15 — the full dataset always stays loaded)
        // STEAM: feed the currently visible discipline subset (zero impact on math/physics/chemistry)
        let fn = ND, fl = LK;
        if (graph === 'steam') { const disp = steamVisible(); fn = disp.nodes; fl = disp.links; }

        // Geometry per mode (deterministic):
        // universe  = free force layout, reset to shell anchors (drift fix);
        // spacefill = pinned to auto-fit education-level shells;
        // compare   = one pinned ball per education level.
        const S = computeShells(ND);
        const counts = {elementary:0, middle:0, high:0, college:0};
        fn.forEach(n => { counts[n.level || 'college']++; });
        fn.forEach(n => {
            n.color = colorCB(n);
            n.val = sizeVal(n);
            if (m === 'spacefill') { const p = shellPos(n, S); n.fx = p.x; n.fy = p.y; n.fz = p.z; }
            else if (m === 'compare') { const p = clusterPos(n, counts); n.fx = p.x; n.fy = p.y; n.fz = p.z; }
            else { const p = shellPos(n, S); n.x = p.x; n.y = p.y; n.z = p.z; n.fx = undefined; n.fy = undefined; n.fz = undefined; }
        });
        refreshModeCap();

        // Re-load graph data with colors and sizes baked in
        G.nodeColor('color')
         .nodeVal('val')
         .nodeRelSize(8)
         .nodeOpacity(1)
         .linkColor(linkColorCB)
         .linkWidth(linkWidthCB)
         .linkOpacity(0.35)
         .linkDirectionalParticles(0)
         .graphData({ nodes: fn, links: fl });

        // Update HUD
        document.getElementById('sub').textContent = i18n.tr('hud.subtitle', {concepts: fn.length, relations: fl.length});
    }

    /* ─── Mode caption ────────────────────────────────────────── */
    function refreshModeCap() {
        const el = document.getElementById('modeCap');
        if (el) el.textContent = i18n.tr('modecap.' + mode);
    }

    /* ─── About panel (innerHTML — i18n.apply uses textContent) ── */
    function refreshAbout() {
        const el = document.querySelector('[data-i18n="about.body"]');
        if (el) el.innerHTML = i18n.tr(graph === 'physics' ? 'about.body_physics' : graph === 'chemistry' ? 'about.body_chemistry' : graph === 'steam' ? 'about.body_steam' : 'about.body');
    }

    /* ─── UI ──────────────────────────────────────────────────────── */
    function mkUI() {
        document.querySelectorAll('[data-m]').forEach(b => {
            b.addEventListener('click', ()=>{
                document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('a'));
                b.classList.add('a'); setMode(b.dataset.m);
            });
        });
        document.querySelectorAll('[data-d]').forEach(b => {
            b.addEventListener('click', ()=>{ switchGraph(b.dataset.d); });
        });
        document.getElementById('rbtn').addEventListener('click', ()=>{
            hideDetail(); clearRipple();
        });
        // STEAM-only controls (visible only in steam mode; no-op otherwise)
        document.querySelectorAll('#steamToggles input[type=checkbox]').forEach(cb => {
            cb.addEventListener('change', () => {
                steamVis[cb.value] = cb.checked;
                if (!steamVis.math && !steamVis.physics && !steamVis.chemistry) { steamVis[cb.value] = true; cb.checked = true; return; }
                applySteamFilter();
            });
        });
        const scb = document.getElementById('steamColorBtn');
        if (scb) scb.addEventListener('click', () => {
            steamColorMode = (steamColorMode === 'level') ? 'discipline' : 'level';
            scb.textContent = i18n.tr(steamColorMode === 'discipline' ? 'steam.color.disc' : 'steam.color.level');
            scb.classList.toggle('a', steamColorMode === 'discipline');
            steamRecolor();
        });
        // Auto Rotate toggle
        document.getElementById('arBtn').addEventListener('click', function() {
            _autoRotate = !_autoRotate;
            this.dataset.ar = _autoRotate ? 'on' : 'off';
            this.classList.toggle('a', _autoRotate);
        });
        // WASD toggle
        const wasdBtn = document.getElementById('wasdBtn');
        window.__paintWasd = function() {
            wasdBtn.classList.toggle('a', _wasd);
            wasdBtn.textContent = i18n.tr(_wasd ? 'wasd.on' : 'wasd.off');
        };
        wasdBtn.addEventListener('click', function() { _wasd = !_wasd; window.__paintWasd(); });
        // UI language switcher (independent from graph filter)
        document.querySelectorAll('[data-u]').forEach(b => {
            b.addEventListener('click', ()=>{
                document.querySelectorAll('[data-u]').forEach(x=>x.classList.remove('a'));
                b.classList.add('a');
                i18n.setLanguage(b.dataset.u);
                i18n.apply();
                refreshAbout(); refreshModeCap(); window.__paintWasd(); refreshCounts();
                updateSteamUI(); refreshSteamPanel();
                document.getElementById('mode-tag').textContent = i18n.tr('mode.'+mode);
                // Hot-switch: open card + search dropdown follow the new UI language
                // ('all' display mode reads i18n.lang, so tooltip follows on next hover)
                if (lastNode && document.getElementById('detail').style.display === 'block') showDetail(lastNode);
                if (document.getElementById('search').value.trim()) paintSearch();
            });
        });
        // About panel
        const about = document.getElementById('about');
        document.getElementById('aboutBtn').addEventListener('click', () => {
            refreshAbout();
            about.style.display = about.style.display === 'block' ? 'none' : 'block';
        });
        document.getElementById('aboutClose').addEventListener('click', () => { about.style.display = 'none'; });
        // Search with predictive dropdown (trilingual match badges + keyboard)
        function matchLang(n, q){
            const lbs = n.labels || {};
            const hit = [];
            if ((n.name || '').toLowerCase().indexOf(q) >= 0) hit.push('ID');
            ['zh','en','de'].forEach(l => { if ((lbs[l] || '').toLowerCase().indexOf(q) >= 0) hit.push(l.toUpperCase()); });
            return hit;
        }
        const searchBox = document.getElementById('search');
        const searchMeta = document.getElementById('searchMeta');
        let searchItems = [], searchSel = -1;
        function matchNodes(q){
            q = (q || '').trim().toLowerCase();
            if (!q) return [];
            if (graph === 'steam') { const disp = steamVisible(); return disp.nodes.filter(n => matchLang(n, q).length > 0); }
            return ND.filter(n => matchLang(n, q).length > 0);
        }
        function paintSel(i){
            searchSel = i;
            searchItems.forEach((it, j) => it.b.classList.toggle('sel', j === i));
        }
        function paintSearch(){
            const qv = searchBox.value.trim();
            const ms = matchNodes(qv);
            searchMeta.innerHTML = '';
            searchMeta.classList.remove('has');
            searchItems = []; searchSel = -1;
            if (!qv) return;
            searchMeta.classList.add('has');
            if (!ms.length) {
                const d = document.createElement('div');
                d.className = 'none';
                d.textContent = i18n.tr('search.none');
                searchMeta.appendChild(d);
                return;
            }
            const q = qv.toLowerCase();
            ms.slice(0, 6).forEach(n => {
                const b = document.createElement('button');
                b.type = 'button';
                const badges = matchLang(n, q).map(l => '<em>' + l + '</em>').join('');
                const disp = nodeLabel(n), nm = (n.name || n.id);
                b.innerHTML = '<span>' + disp + (disp !== nm ? ' · ' + nm : '') + '</span><span>' + badges + '</span>';
                b.addEventListener('click', () => focusNode(n));
                const idx = searchItems.length;
                b.addEventListener('mousemove', () => paintSel(idx));
                searchMeta.appendChild(b);
                searchItems.push({ b: b, n: n });
            });
            if (ms.length > 6) {
                const more = document.createElement('div');
                more.className = 'more';
                more.textContent = '+' + (ms.length - 6) + ' ' + i18n.tr('search.more');
                searchMeta.appendChild(more);
            }
            paintSel(0);
        }
        searchBox.addEventListener('input', paintSearch);
        searchBox.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown' && searchItems.length) { e.preventDefault(); paintSel((searchSel + 1) % searchItems.length); }
            else if (e.key === 'ArrowUp' && searchItems.length) { e.preventDefault(); paintSel((searchSel - 1 + searchItems.length) % searchItems.length); }
            else if (e.key === 'Enter') {
                if (searchSel >= 0 && searchItems[searchSel]) focusNode(searchItems[searchSel].n);
                else { const ms = matchNodes(searchBox.value); if (ms.length) focusNode(ms[0]); }
            }
            else if (e.key === 'Escape') { searchMeta.innerHTML = ''; searchMeta.classList.remove('has'); searchItems = []; searchBox.blur(); }
        });
        document.addEventListener('click', e => {
            if (e.target && e.target.closest && !e.target.closest('#search') && !e.target.closest('#searchMeta')) {
                searchMeta.innerHTML = ''; searchMeta.classList.remove('has'); searchItems = [];
            }
        });
    }

    /* ─── Helpers: counts / caption / about / focus ───────────── */
    function refreshCounts(){
        if (!G) return;
        const gd = G.graphData();
        const fn = gd ? gd.nodes.length : ND.length, fl = gd ? gd.links.length : LK.length;
        document.getElementById('sub').textContent =
            i18n.tr('hud.subtitle', {concepts: fn, relations: fl});
    }
    function focusNode(n) {
        showDetail(n);
        ripple(n);
        if (!G || n.x == null) return;
        const r = Math.hypot(n.x || 0, n.y || 0, n.z || 0) || 200;
        const f = (r + 150) / r;
        G.cameraPosition({ x: (n.x || 0) * f, y: (n.y || 0) * f, z: (n.z || 0) * f },
            { x: n.x || 0, y: n.y || 0, z: n.z || 0 }, 900);
    }

    /* ─── Start ───────────────────────────────────────────────────── */
    if (document.readyState === 'complete') init();
    else window.addEventListener('load', init);
    })();
    </script>
</body>
</html>
