<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counterexample Hunter · Mini-Labor 2</title>
<style>
body{margin:0;background:#f1f3f5;color:#0a1f3d;font:17px Georgia,"Noto Serif SC",serif}
header{background:#f8fafc;border-bottom:1px solid #c6cdd6;padding:28px 20px;text-align:center}
h1{margin:0;font-size:30px;letter-spacing:.5px}
.sub{color:#4a5a78;margin:8px 0 0}
.stats{margin:10px 0 0;color:#1e3a8a;font-size:15px}
.note{max-width:760px;margin:12px auto 0;color:#4a5a78;font-size:15px}
nav{margin-top:12px}
nav button{background:#f8fafc;color:#0a1f3d;border:1px solid #c6cdd6;border-radius:20px;padding:5px 16px;font:inherit;font-size:15px;cursor:pointer}
nav button.on{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
main{max-width:900px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.card{background:#f8fafc;border:1px solid #c6cdd6;border-radius:10px;padding:14px 16px}
.id{font-size:13px;color:#4a5a78}
.lbl{margin:6px 0;font-size:17px}
.refs{font-size:14px;color:#4a5a78;border-top:1px solid #c6cdd6;padding-top:8px}
.claim{margin:8px 0}
.card button{background:none;border:1px solid #1e3a8a;color:#1e3a8a;border-radius:8px;padding:5px 12px;font:inherit;font-size:15px;cursor:pointer}
.rule{border-top:1px solid #c6cdd6;padding-top:8px;color:#0a1f3d}
footer{text-align:center;color:#4a5a78;font-size:13px;padding:18px;border-top:1px solid #c6cdd6}
</style>
</head>
<body>
<header>
<h1 id="t"></h1>
<p class="sub" id="s"></p>
<p class="stats" id="st"></p>
<p class="note" id="n"></p>
<nav><button id="b0" onclick="setL(0)">DE</button> <button id="b1" onclick="setL(1)">中文</button> <button id="b2" onclick="setL(2)">EN</button></nav>
</header>
<main><div class="grid" id="g"></div></main>
<footer>Quelle: data/math_extractions/merged/aligned_data.json (219 Gruppen) + merged_concepts.json (557 Konzepte) · frozen numbers only</footer>
<script>
const T={
title:["Gegenbeispiel-Jäger","反例猎人","Counterexample Hunter"],
sub:["Mini-Labor 2 · Falsifikation in drei Sprachen","迷你实验 2 · 三语证伪","Mini-Lab 2 · falsification in three languages"],
stats:["Frozen: 0.519 · 0.933 · 0.938 · T1 0.556→0.020 · 219 Gruppen","Frozen: 0.519 · 0.933 · 0.938 · T1 0.556→0.020 · 219 组","Frozen: 0.519 · 0.933 · 0.938 · T1 0.556→0.020 · 219 groups"],
note:["Math-only: 219 Gruppen aus Analysis, Algebra, Statistik u.a. — keine Sozial-Konzepte im Korpus.","仅数学：219 组来自微积分、线性代数、统计等——库中无社会学概念。","Math only: 219 groups from calculus, linear algebra, statistics and more — no social concepts in the corpus."],
claim:["C: DE-, EN- und ZH-Label sind drei verschiedene Begriffe?","C：德、英、中三个标签是三个不同概念？","C: the DE, EN and ZH labels are three different concepts?"],
btn:["Behauptung C kippen?","推翻论断 C？","Overturn claim C?"],
rule:["Nein — {d} DE-, {e} EN- und {z} ZH-Belege teilen eine Gruppen-ID: verschiedene Zeichen, ein Begriff.","否——{d} 条德语、{e} 条英语、{z} 条中文证据共享同一组 ID：字形不同，概念同一。","No — {d} DE, {e} EN and {z} ZH refs share one group id: different strings, one concept."]};
const G=[
["math_calculus_定积分","Bestimmtes Integral","定积分","Definite Integral",0,1,1],
["math_calculus_链式法则","链式法则","链式法则","Chain Rule",1,1,1],
["math_calculus_洛必达法则","Regel von L'Hospital","洛必达法则","洛必达法则",1,1,1],
["math_linear_algebra_线性变换","Lineare Abbildung","线性变换","Linear Transformation",1,1,1],
["math_linear_algebra_特征方程","Charakteristische Gleichung","特征方程","Characteristic Equation",1,1,2],
["math_statistics_条件概率","Bedingte Wahrscheinlichkeit","条件概率","Conditional Probability",2,1,1],
["math_statistics_正态分布","正态分布","正态分布","Normal Distribution",2,2,1],
["math_elementary_自然数","Natürliche Zahlen","自然数","Natural Numbers",1,0,1]];
let L=0;
function R(s,g){return s.replace("{d}",g[4]).replace("{e}",g[5]).replace("{z}",g[6])}
function render(){
t.textContent=T.title[L];s.textContent=T.sub[L];st.textContent=T.stats[L];n.textContent=T.note[L];
for(let i=0;i<3;i++)document.getElementById("b"+i).className=i===L?"on":"";
g.innerHTML=G.map((x,i)=>"<article class=card><div class=id>"+x[0]+"</div><div class=lbl>DE "+x[1]+" · ZH "+x[2]+" · EN "+x[3]+"</div><div class=refs>Refs DE "+x[4]+" · EN "+x[5]+" · ZH "+x[6]+"</div><p class=claim>"+T.claim[L]+"</p><button onclick=\"flip("+i+")\">"+T.btn[L]+"</button><p class=rule id=o"+i+" hidden>"+R(T.rule[L],x)+"</p></article>").join("");
}
function setL(i){L=i;render()}
function flip(i){let e=document.getElementById("o"+i);e.hidden=!e.hidden}
render();
</script>
</body>
</html>
