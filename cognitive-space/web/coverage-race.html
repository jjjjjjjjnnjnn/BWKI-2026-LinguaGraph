<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coverage Race — NRW · UK · US · CN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --surface:#f1f3f5; --surface2:#f8fafc; --text:#0a1f3d; --text2:#4a5a78; --rule:#c6cdd6; --accent:#1e3a8a; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"IBM Plex Sans","Noto Sans SC",sans-serif; background:var(--surface); color:var(--text); }
.chart { position:absolute; inset:0; overflow:auto; display:flex; flex-direction:column; align-items:flex-start; padding:168px 20px 60px; }
.chart svg { flex:0 0 auto; margin:0 auto; background:var(--surface2); border:1px solid var(--rule); border-radius:10px; box-shadow:0 18px 48px rgba(10,31,61,.10); }
.chart text { font-family:"IBM Plex Sans","Noto Sans SC",sans-serif; }
.method { flex:0 0 auto; margin:18px auto 0; width:900px; max-width:94vw; background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:8px; font-size:.62rem; color:var(--text2); }
.method summary { cursor:pointer; padding:10px 14px; font-weight:600; color:var(--accent); }
.method .msec { padding:0 14px 10px; line-height:1.6; }
.method .msec b { color:var(--text); display:block; margin-bottom:2px; }
.method .msec + .msec { border-top:1px dashed var(--rule); padding-top:10px; }
.method .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.58rem; }
.hud { position:absolute; top:16px; left:16px; z-index:10; background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:8px; padding:12px 14px; width:372px; max-width:92vw; box-shadow:0 1px 0 var(--rule),0 18px 48px rgba(10,31,61,.18); }
.hud h1 { font-family:"Playfair Display",Georgia,serif; font-weight:500; font-size:1.05rem; }
.hud h1 span { color:#e11d48; }
.hud .sub { font-size:.6rem; color:var(--text2); margin:4px 0 8px; line-height:1.55; }
.hud .row { font-size:.6rem; color:var(--text2); margin-top:4px; line-height:1.5; }
.hud .row b { color:var(--text); }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
.replay { margin-top:8px; font-family:inherit; font-size:.66rem; font-weight:600; padding:8px 18px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
.replay:hover { background:#0a1f3d; }
.nav { position:absolute; top:16px; right:16px; z-index:10; display:flex; gap:6px; }
.nav a, .nav button { font-size:.62rem; color:var(--accent); background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:6px; padding:6px 12px; text-decoration:none; cursor:pointer; font-family:inherit; font-weight:600; }
.nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
#tip { position:absolute; z-index:20; pointer-events:none; background:rgba(10,31,61,.92); color:#fff; font-size:.62rem; padding:6px 10px; border-radius:6px; display:none; line-height:1.5; max-width:260px; }
.scope { position:absolute; bottom:14px; left:16px; z-index:10; font-size:.56rem; color:var(--text2); font-family:ui-monospace,Menlo,Consolas,monospace; max-width:64vw; line-height:1.6; }
.hint { position:absolute; bottom:14px; right:16px; z-index:10; font-size:.58rem; color:var(--text2); }
</style>
</head>
<body>
<div class="chart" id="chart"></div>
<div class="hud">
  <h1>Coverage <span data-k="t_race">Race</span></h1>
  <div class="sub" data-k="sub"></div>
  <div class="row"><span class="dot" style="background:#e11d48"></span><b>CN 95.4</b>&nbsp;&nbsp;<span class="dot" style="background:#7c3aed"></span><b>UK 37.3</b>&nbsp;&nbsp;<span class="dot" style="background:#0284c7"></span><b>US 17.2</b>&nbsp;&nbsp;<span class="dot" style="background:#b45309"></span><b>NRW 12.7</b></div>
  <div class="row" data-k="gran"></div>
  <button class="replay" id="replay" data-k="replay">↻ Replay</button>
</div>
<div class="nav">
  <a href="../portal/cspace.html" data-k="back">← Galerie</a>
  <button data-l="de" class="active">DE</button><button data-l="en">EN</button><button data-l="zh">ZH</button>
</div>
<div id="tip"></div>
<div class="scope" data-k="scope"></div>
<div class="hint" data-k="hint"></div>
<script>
// FROZEN overall coverage, paper §8.5 (percent) + per-stage rows from config/expert_graphs/coverage_all_curricula.json
// stages: [label, matched, concepts, coverage]
var SYS = [
{ id:'CN', color:'#e11d48', overall:{m:83, n:87, c:0.954},
  stages:[["1–2",18,18,1.0],["3–4",18,19,0.9474],["5–6",25,26,0.9615],["7–9",22,24,0.9167]] },
{ id:'UK', color:'#7c3aed', overall:{m:148, n:397, c:0.3728},
  stages:[["Y1",10,30,0.3333],["Y2",16,40,0.4],["Y3",15,36,0.4167],["Y4",17,42,0.4048],["Y5",25,52,0.4808],["Y6",25,57,0.4386],["KS3",24,80,0.3],["KS4",17,60,0.2833]] },
{ id:'US', color:'#0284c7', overall:{m:366, n:2124, c:0.1723},
  stages:[["K–5",127,708,0.1794],["6–8",127,708,0.1794],["9–12",127,708,0.1794]] },
{ id:'NRW', color:'#b45309', overall:{m:38, n:299, c:0.1271},
  stages:[["Erprobung",12,58,0.2069],["Stufe 1",9,48,0.1875],["Stufe 2",9,59,0.1525],["Einführung",7,42,0.1667],["Grundkurs",1,39,0.0256],["Leistungskurs",4,53,0.0755]] }
];
var T = {
de: { t_race:'Race', sub:'Vier Systeme, ein Maß: Anteil der Lehrplan-Begriffe mit Treffer im Lehrbuch (frozen: CN 95,4 · UK 37,3 · US 17,2 · NRW 12,7, §8.5). Stufen-Balken laufen gestaffelt — Replay drücken.',
  gran:'Ehrlichkeits-Fußnote: Nenner sind nicht vergleichbar — US 2124 · UK 397 · CN 87 · NRW 299 Lehrplan-Begriffe (Granularität). Prozente lesen, Nenner mitdenken.',
  replay:'↻ Replay', ov_t:'gesamt', st_t:'Stufen',
  scope:'SCOPE · Coverage = Treffer / Lehrplan-Begriffe, Keyword-Brücke + 2-Overlap · config/expert_graphs/coverage_all_curricula.json · Lehrbuch: LinguaGraph math_full.json (3833) · §8.5',
  hint:'Werte hovern · Replay für das Rennen', back:'← Galerie',
  m_sum:'Details · wie das Rennen läuft', m_src_t:'Quelle', m_src:'Alle Stufen-Zeilen aus <span class="mono">config/expert_graphs/coverage_all_curricula.json</span>, Overall-Werte frozen nach §8.5 (CN 95,4 · UK 37,3 · US 17,2 · NRW 12,7). Lehrbuch: LinguaGraph math_full.json (3833 Begriffe).',
  m_calc_t:'Methode', m_calc:'Coverage = getroffene / Lehrplan-Begriffe (Keyword-Brücke, 2-Overlap-Schwelle). Balkenlänge = Coverage; nichts reskaliert. Animation ist gestaffelt (Spitzenreiter zuerst), Dauer ~1,6 s — reine Inszenierung, die Zahlen stehen fest.',
  m_read_t:'Lesart', m_read:'CN führt auf jeder Stufe (≥91,7 %); UK pendelt um 28–48 %; US liegt flach bei 17,9 % je Stufe; NRW fällt in der Sek II ab (Grundkurs 2,6 %). Aber: Die Nenner (2124 vs. 87) machen die Prozente unterschiedlich fein — siehe Fußnote.' },
en: { t_race:'Race', sub:'Four systems, one yardstick: share of curriculum concepts matched in the textbook (frozen: CN 95.4 · UK 37.3 · US 17.2 · NRW 12.7, §8.5). Stage bars run staggered — hit replay.',
  gran:'Honesty footnote: denominators are not comparable — US 2124 · UK 397 · CN 87 · NRW 299 curriculum concepts (granularity). Read the percents, keep the denominators in mind.',
  replay:'↻ Replay', ov_t:'overall', st_t:'stages',
  scope:'SCOPE · coverage = matched / curriculum concepts, keyword bridge + 2-overlap · config/expert_graphs/coverage_all_curricula.json · textbook: LinguaGraph math_full.json (3833) · §8.5',
  hint:'hover values · replay the race', back:'← Gallery',
  m_sum:'Details · how the race runs', m_src_t:'Source', m_src:'All stage rows from <span class="mono">config/expert_graphs/coverage_all_curricula.json</span>, overall values frozen per §8.5 (CN 95.4 · UK 37.3 · US 17.2 · NRW 12.7). Textbook: LinguaGraph math_full.json (3833 concepts).',
  m_calc_t:'Method', m_calc:'Coverage = matched / curriculum concepts (keyword bridge, 2-overlap threshold). Bar length = coverage; nothing rescaled. Animation is staggered (leader first), ~1.6 s — pure staging, the numbers are fixed.',
  m_read_t:'Reading', m_read:'CN leads every stage (≥91.7%); the UK hovers at 28–48%; the US sits flat at 17.9% per stage; NRW drops in Sek II (Grundkurs 2.6%). But: the denominators (2124 vs 87) make the percents unevenly fine-grained — see footnote.' },
zh: { t_race:'竞速', sub:'四个体系，一把尺子：课标概念在教材中的命中占比（冻结值：CN 95.4 · UK 37.3 · US 17.2 · NRW 12.7，§8.5）。各阶段柱子依次起跑——点击重播。',
  gran:'诚实注脚：分母不可比——课标概念数 US 2124 · UK 397 · CN 87 · NRW 299（颗粒度）。看百分比时请同时看分母。',
  replay:'↻ 重播', ov_t:'总体', st_t:'各阶段',
  scope:'口径 · 覆盖率＝命中 / 课标概念，关键词桥接 + 2 重叠阈值 · config/expert_graphs/coverage_all_curricula.json · 教材：LinguaGraph math_full.json (3833) · §8.5',
  hint:'悬停看值 · 重播竞速', back:'← 展厅',
  m_sum:'详细 · 竞速怎么跑', m_src_t:'数据来源', m_src:'全部阶段行来自 <span class="mono">config/expert_graphs/coverage_all_curricula.json</span>，总体值为 §8.5 冻结值（CN 95.4 · UK 37.3 · US 17.2 · NRW 12.7）。教材：LinguaGraph math_full.json（3833 概念）。',
  m_calc_t:'计算口径', m_calc:'覆盖率＝命中 / 课标概念（关键词桥接，2 重叠阈值）。柱长＝覆盖率，无重缩放。动画依次起跑（领先者先行），约 1.6 秒——纯属演绎，数字固定不变。',
  m_read_t:'怎么读', m_read:'CN 各阶段全面领先（≥91.7%）；UK 在 28–48% 之间摆动；US 各阶段持平 17.9%；NRW 在高年级段下滑（Grundkurs 2.6%）。但：分母（2124 vs 87）让百分比的精细度并不对等——见注脚。' }
};
var lang = 'de', rafId = null;
try {
  lang = localStorage.getItem('portal_lang') || localStorage.getItem('cspace_lang') || null;
  if (!lang) { var nv = (navigator.language||'en').toLowerCase(); lang = nv.indexOf('zh')===0 ? 'zh' : (nv.indexOf('de')===0 ? 'de' : 'en'); }
} catch(e) { lang = 'de'; }
if (!T[lang]) lang = 'de';
var NS = 'http://www.w3.org/2000/svg';
function el(n, a, p) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var tip = document.getElementById('tip');
function showTip(e, h) { tip.innerHTML = h; tip.style.display = 'block'; tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY+10)+'px'; }
function hideTip() { tip.style.display = 'none'; }
var bars = [];
function build() {
  var box = document.getElementById('chart'); box.innerHTML = ''; bars = [];
  var t = T[lang];
  var W = 920, L = 190, PW = 480, TOP = 16, OH = 34, SH = 20, GAP = 8, SECT = 26;
  var H = TOP;
  SYS.forEach(function(s) { H += 22 + OH + GAP + 16 + s.stages.length*(SH+GAP) + SECT; });
  H += 20;
  var X = function(c) { return L + c*PW; };
  var svg = el('svg', {width: W, height: H, viewBox: '0 0 '+W+' '+H, role: 'img'}, box);
  var y = TOP;
  SYS.forEach(function(s, si) {
    var hd = el('text', {x: 20, y: y+14, 'font-size': 15, 'font-weight': 700, fill: s.color}, svg);
    hd.textContent = s.id + '  ·  ' + t.ov_t + ' ' + s.overall.m + '/' + s.overall.n;
    y += 22;
    var ov = el('rect', {x: L, y: y, width: 2, height: OH, fill: s.color, rx: 5}, svg);
    var ovt = el('text', {x: L+8, y: y+23, 'font-size': 14, 'font-weight': 700, fill: '#0a1f3d'}, svg);
    bars.push({rect: ov, val: ovt, x0: L, target: s.overall.c, delay: si*0.18, txt: function(v) { return (v*100).toFixed(1)+'%'; }, fmt: s.overall});
    (function(ss, rr) {
      rr.addEventListener('mousemove', function(e) { showTip(e, '<b>'+ss.id+' '+t.ov_t+'</b><br>'+ss.overall.m+'/'+ss.overall.n+' · '+(ss.overall.c*100).toFixed(1)+'%'); });
      rr.addEventListener('mouseleave', hideTip);
    })(s, ov);
    y += OH + GAP;
    var st = el('text', {x: 20, y: y+12, 'font-size': 11, fill: '#4a5a78'}, svg);
    st.textContent = t.st_t + ' (' + s.stages.length + ')';
    y += 16;
    s.stages.forEach(function(g, gi) {
      var lb = el('text', {x: L-10, y: y+14, 'text-anchor': 'end', 'font-size': 11, fill: '#0a1f3d'}, svg);
      lb.textContent = g[0];
      var r = el('rect', {x: L, y: y, width: 2, height: SH, fill: s.color, opacity: 0.72, rx: 4}, svg);
      var vt = el('text', {x: L+8, y: y+14, 'font-size': 11, fill: '#0a1f3d'}, svg);
      bars.push({rect: r, val: vt, x0: L, target: g[3], delay: 0.5 + si*0.18 + gi*0.06, txt: function(v) { return (v*100).toFixed(1)+'% · '+g[1]+'/'+g[2]; }, fmt: {m:g[1], n:g[2], c:g[3]}});
      (function(ss, gg, rr) {
        rr.addEventListener('mousemove', function(e) { showTip(e, '<b>'+ss.id+' · '+esc(gg[0])+'</b><br>'+gg[1]+'/'+gg[2]+' · '+(gg[3]*100).toFixed(2)+'%'); });
        rr.addEventListener('mouseleave', hideTip);
      })(s, g, r);
      y += SH + GAP;
    });
    y += SECT;
    if (si < SYS.length-1) { el('line', {x1: 20, y1: y-SECT+8, x2: W-20, y2: y-SECT+8, stroke: '#e2e8f0', 'stroke-width': 1}, svg); }
  });
  for (var g = 0; g <= 1.001; g += 0.25) {
    var gx = X(g);
    var gt = el('text', {x: gx, y: H-4, 'text-anchor': 'middle', 'font-size': 10, fill: '#8595ad'}, svg);
    gt.textContent = Math.round(g*100)+'%';
  }
  var det = document.createElement('details');
  det.className = 'method';
  det.innerHTML = '<summary>'+esc(t.m_sum)+'</summary>' +
    '<div class="msec"><b>'+esc(t.m_src_t)+'</b><p>'+t.m_src+'</p></div>' +
    '<div class="msec"><b>'+esc(t.m_calc_t)+'</b><p>'+t.m_calc+'</p></div>' +
    '<div class="msec"><b>'+esc(t.m_read_t)+'</b><p>'+t.m_read+'</p></div>';
  box.appendChild(det);
  race(X);
}
function race(X) {
  if (rafId) cancelAnimationFrame(rafId);
  var t0 = null, DUR = 1600;
  function fr(ts) {
    if (!t0) t0 = ts;
    var done = true;
    bars.forEach(function(b) {
      var p = Math.min(1, Math.max(0, ((ts-t0)/DUR - b.delay) / (1 - b.delay || 1)));
      if (p < 1) done = false;
      var e = 1 - Math.pow(1-p, 3);
      var w = Math.max(2, (X(b.target)-b.x0)*e);
      b.rect.setAttribute('width', w);
      b.val.setAttribute('x', b.x0 + w + 8);
      b.val.textContent = b.txt(b.target*e);
    });
    if (!done) rafId = requestAnimationFrame(fr);
  }
  rafId = requestAnimationFrame(fr);
}
function applyLang() {
  var t = T[lang];
  document.querySelectorAll('[data-k]').forEach(function(n) { var k = n.getAttribute('data-k'); if (t[k] !== undefined) n.innerHTML = t[k]; });
  document.querySelectorAll('.nav button[data-l]').forEach(function(b) { b.classList.toggle('active', b.dataset.l === lang); });
  document.documentElement.lang = lang;
  document.getElementById('replay').textContent = t.replay;
  build();
}
document.querySelectorAll('.nav button[data-l]').forEach(function(b) {
  b.addEventListener('click', function() { lang = b.dataset.l; try { localStorage.setItem('cspace_lang', lang); } catch(e) {} applyLang(); });
});
document.getElementById('replay').addEventListener('click', function() {
  var box = document.getElementById('chart'); var svg = box.querySelector('svg');
  var W = 920, L = 190, PW = 480;
  race(function(c) { return L + c*PW; });
});
applyLang();
</script>
</body>
</html>
