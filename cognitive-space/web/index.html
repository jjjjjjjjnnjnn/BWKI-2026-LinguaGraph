    <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family:'IBM Plex Sans','Inter','Segoe UI',system-ui,-apple-system,sans-serif;

    }
    #graph-container {
        width:100vw; height:100vh;

    #graph-container canvas { display:block; }

    #loading {
        position:fixed; inset:0; z-index:9999; background:#f1f3f5;
        display:flex; flex-direction:column; align-items:center;
        justify-content:center; transition:opacity .8s;
    }
    #loading.hidden{ opacity:0; pointer-events:none; }
    #loading .spinner{
        width:28px; height:28px;
        border:2px solid rgba(30,58,138,.15); border-top-color:#1e3a8a;
        border-radius:50%;
        animation:spin .9s cubic-bezier(.4,0,.2,1) infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    #loading p{ color:#0a1f3d; font-size:.8rem; margin-top:14px; font-weight:500; }
    #loading .err{ color:#b3372f; font-size:.7rem; margin-top:8px; display:none; }

    #hud {
        position:absolute; top:16px; left:16px; z-index:100;
        background:rgba(248,250,252,.94); backdrop-filter:blur(14px);
        border:1px solid #c6cdd6; border-radius:8px;
        padding:12px 14px; min-width:190px; user-select:none;
        transition:opacity .3s;
        box-shadow:0 1px 0 #c6cdd6, 0 18px 48px rgba(10,31,61,.25);
    }
    #hud h1{ font-size:.8rem; font-weight:600; letter-spacing:.4px; color:#0a1f3d; }
    #hud h1 span{ color:#1e3a8a; }
    #hud .sub{ font-size:.55rem; color:#4a5a78; margin-bottom:8px; }

    .s{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-bottom:10px; }
    .si{ display:flex; flex-direction:column; }
    .sv{ font-size:.95rem; font-weight:600; color:#0a1f3d; font-feature-settings:"tnum"; }
    .sl{ font-size:.5rem; color:#4a5a78; text-transform:uppercase; letter-spacing:.6px; }

    .br{ display:flex; gap:2px; margin-bottom:5px; flex-wrap:wrap; }
    .b{
        padding:3px 9px; border-radius:4px; font-size:.55rem; font-weight:500;
        cursor:pointer; border:1px solid #c6cdd6;
        background:#f1f3f5; color:#4a5a78;
        transition:all .2s; font-family:inherit;
    }
    .b:hover{ background:rgba(30,58,138,.10); color:#0a1f3d; border-color:#1e3a8a; }
    .b:active{ transform:translateY(1px); }
    .b:focus-visible{ outline:2px solid #1e3a8a; outline-offset:2px; }
    .b.a{ border-color:#1e3a8a; color:#1e3a8a; font-weight:600; }
    .b.v.a{ background:rgba(30,58,138,.10); }
    .b.l.a{ background:rgba(30,126,77,.10); color:#1e7e4d; border-color:#1e7e4d; }

    .li{ display:flex; align-items:center; gap:3px; font-size:.5rem; color:#4a5a78; }
    .ld{ width:5px; height:5px; border-radius:50%; }

    #detail {
        position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
        z-index:100; background:rgba(248,250,252,.96); backdrop-filter:blur(14px);
        border:1px solid #1e3a8a; border-radius:8px;

    #detail .metrics .row{ display:flex; justify-content:space-between; padding:1px 0; }

    /* Mode caption */
    .cap{ font-size:.55rem; color:#4a5a78; margin-bottom:6px; line-height:1.4; min-height:1.9em; }

    /* UI language switcher */
    .ulab{ font-size:.5rem; color:#8595ad; text-transform:uppercase; letter-spacing:.6px; margin:2px 0; }

    /* About panel */
    #aboutBtn{ margin-left:auto; }
    #about {
        position:absolute; top:16px; right:16px; z-index:200;
        background:rgba(248,250,252,.98); border:1px solid #1e3a8a; border-radius:8px;
        padding:14px 16px; width:320px; max-width:calc(100vw - 32px);
        display:none; box-shadow:0 18px 48px rgba(10,31,61,.25);
        font-size:.62rem; color:#0a1f3d; line-height:1.5;
    }
    #about h2{ font-size:.72rem; color:#1e3a8a; margin-bottom:6px; }
    #about p{ margin-bottom:6px; color:#33415c; }

    #about .mono{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.58rem; }
    #aboutClose{ float:right; border:1px solid #c6cdd6; background:#f1f3f5; border-radius:4px; font-size:.55rem; padding:2px 8px; cursor:pointer; color:#4a5a78; font-family:inherit; }

    /* Diffusion ring animation (legend-consistent indigo) */
    .ripple-ring {
        position: fixed;
        border-radius: 50%;
        border: 2px solid rgba(30,58,138,0.7);
        pointer-events: none;
        z-index: 200;
        animation: ripple-expand 1.2s cubic-bezier(0, 0.5, 0.3, 1) forwards;
    }
    @keyframes ripple-expand {
        0% {
            width: 10px; height: 10px;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        100% {
            width: 200px; height: 200px;
            opacity: 0;
            transform: translate(-50%, -50%) scale(3);
        }
    }

    <script>
// CognitiveSpace — Embedded visualization data
// 556 nodes, 238 links (visual subset of 525 relations; manifest.json)
// 68 textbooks: 39 ZH + 18 EN + 11 DE

</script>
    <script>
    (() => {
    'use strict';

    /* ═══════════════════════════════════════════════════════════════
       CognitiveSpace — 3D Math Knowledge Graph
       Architecture: Pure 3d-force-graph API, no direct THREE refs.
       View modes, BFS ripple, language filtering.
       ═══════════════════════════════════════════════════════════════ */

    const LV = {
        elementary: { c:'#1e7e4d', l:'Elementary' },
        middle:     { c:'#0e7490', l:'Middle' },
        high:       { c:'#1e3a8a', l:'High' },
        college:    { c:'#6d28d9', l:'College' },
    };
    const MT = { universe:'UNIVERSE', spacefill:'SPACE-FILL', compare:'COMPARE' };

    let G, ND=[], LK=[], ADJ=new Map();
    let mode='universe', lang='all', graph='math', rT=null, _autoRotate=false, _wasd=true;

    /* ─── Graph registry (math + physics share one viewer) ────── */
    const GRAPHS = {
        math: { data: () => (typeof COGNITIVE_DATA_EXT !== 'undefined' ? COGNITIVE_DATA_EXT : (typeof COGNITIVE_DATA !== 'undefined' ? COGNITIVE_DATA : null)) },
        physics: { data: () => (typeof data_physics !== 'undefined' ? data_physics : null) },
    };
    function switchGraph(g, pushState) {
        if (!GRAPHS[g] || !G) return;
        const d = GRAPHS[g].data();
        if (!d || !d.nodes || !d.nodes.length) return;
        graph = g;
        ND = d.nodes; LK = d.links;
        document.getElementById('sC').textContent = ND.length;
        document.getElementById('sR').textContent = LK.length;
        document.getElementById('sL').textContent = new Set(ND.map(n=>n.level||'')).size;
        document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('a', x.dataset.d === g));
        lang = 'all';
        document.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('a', x.dataset.g === 'all'));
        document.getElementById('search').value = '';
        document.getElementById('searchMeta').innerHTML = '';
        hideDetail(); clearRipple();
        buildAdj();
        setMode(mode);
        try { if (pushState !== false && window.history && history.replaceState) history.replaceState(null, '', g === 'math' ? location.pathname : '?graph=' + g); } catch(e) {}
    }

    /* ─── Init ────────────────────────────────────────────────────── */
    function init() {
        // Check dependencies
        if (typeof ForceGraph3D === 'undefined') {
            document.getElementById('loadErr').textContent = ''+i18n.tr('error.load')+'';
            document.getElementById('loadErr').style.display = 'block';
            return;
        }

        const data = typeof COGNITIVE_DATA_EXT !== 'undefined' ? COGNITIVE_DATA_EXT :
                     typeof COGNITIVE_DATA !== 'undefined' ? COGNITIVE_DATA : null;
        if (!data || !data.nodes || !data.nodes.length) {
            document.getElementById('loadErr').textContent = ''+i18n.tr('error.data')+'';
            document.getElementById('loadErr').style.display = 'block';
            return;
        }

        ND = data.nodes; LK = data.links;
        document.getElementById('sC').textContent = ND.length;
        document.getElementById('sR').textContent = LK.length;
        document.getElementById('sL').textContent = new Set(ND.map(n=>n.level||'')).size;
        document.getElementById('sub').textContent = i18n.tr('hud.subtitle', {concepts: ND.length, relations: LK.length});

        buildAdj();
        mkGraph();
        mkUI();
        i18n.apply();
        // i18n.detect() already follows browser on first visit; just sync widgets
        refreshAbout(); refreshModeCap(); window.__paintWasd();
        document.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('a', x.dataset.u === i18n.lang));
        // Deep link: ?graph=physics
        try {
            const q = new URLSearchParams(location.search).get('graph');
            if (q === 'physics') switchGraph('physics', false);
        } catch(e) {}

        // Hide loading
        setTimeout(() => {
            document.getElementById('loading').classList.add('hidden');
            setTimeout(() => {
                const e = document.getElementById('loading');
                if (e) e.style.display = 'none';
            }, 800);
        }, 600);
    }

    /* ─── Adjacency ───────────────────────────────────────────────── */
    function buildAdj() {
        ADJ.clear();
        ND.forEach(n => ADJ.set(n.id, new Set()));
        LK.forEach(l => {
            const s = typeof l.source==='object' ? l.source.id : l.source;
            const t = typeof l.target==='object' ? l.target.id : l.target;
            if (ADJ.has(s) && ADJ.has(t)) { ADJ.get(s).add(t); ADJ.get(t).add(s); }
        });
    }

    /* ─── Graph ───────────────────────────────────────────────────── */
    // Callback functions shared between mkGraph() and setLang()/setMode()
    // Defined here so both can access them (JavaScript scope)
    function colorCB(n) {
        if (n._r != null) {
            const d = n._r;
            return d === 0 ? '#1e3a8a' : d === 1 ? '#0e7490' : d === 2 ? '#b45309' : '#c6cdd6';
        }
        if (n._h) return '#dbe2ea';
        return (LV[n.level] || LV.college).c;
    }
    function opacityCB(n) {
        if (n._r != null) return n._r === 0 ? 1 : n._r === 1 ? .85 : n._r === 2 ? .5 : .25;
        if (n._h) return .02;
        return 1;
    }
    function degreeOf(id){ const s = ADJ.get(id); return s ? s.size : 0; }
    // Node size = degree (connections). Compare mode adds a trilingual bonus.
    function sizeVal(n){
        const d = degreeOf(n.id);
        if (mode === 'compare') {
            const langs = Object.keys(n.labels || {}).length;
            return 2 + d * 1.2 + (langs >= 3 ? 4 : langs === 2 ? 2 : 0);
        }
        return 2 + d * 2.2;
    }
    function valCB(n) { return sizeVal(n); }

    /* ─── Deterministic hash ──────────────────────────────────────────── */
    function hashStr(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash = hash & hash;
        }
        return Math.abs(hash);
    }

    /* ─── Shell radii by education level ──────────────────────────────── */
    // Node counts: elementary=37, middle=46, high=193, college=298
    // Shell thickness scales with node count
    const SHELL = {
        elementary: { minR: 0,   maxR: 50  },
        middle:     { minR: 60,  maxR: 120 },
        high:       { minR: 140, maxR: 230 },
        college:    { minR: 250, maxR: 320 },
    };

    function mkGraph() {
        ND.forEach(n => {
            n.color = colorCB(n);
            n.val = sizeVal(n);

            // Deterministic position within spherical shell (hash-based, no Math.random)
            const shell = SHELL[n.level || 'college'] || SHELL.college;
            const h = hashStr(n.id);
            const r = shell.minR + (h % 1001) / 1000 * (shell.maxR - shell.minR);
            const theta = (h % 997) / 997 * Math.PI * 2;
            const phi = Math.acos(2 * (((h * 13 + 7) % 1000) / 1000) - 1);
            n.x = r * Math.sin(phi) * Math.cos(theta);
            n.y = r * Math.sin(phi) * Math.sin(theta);
            n.z = r * Math.cos(phi);
            // Remember shell anchor for Space-Fill pinning
            n.sx = n.x; n.sy = n.y; n.sz = n.z;
        });

        G = ForceGraph3D()(document.getElementById('graph-container'))
            .nodeColor('color')
            .nodeVal('val')
            .nodeResolution(16)
            .nodeRelSize(8)
            .linkColor(l => l.inferred ? '#b9c7d8' : '#7aa3c8')
            .linkWidth(0.35)
            .linkOpacity(0.35)
            .linkDirectionalParticles(0)
            .backgroundColor('#f1f3f5')
            .showNavInfo(false)
            .width(innerWidth)
            .height(innerHeight)
            .graphData({ nodes: ND, links: LK });
        window.G = G;

        G.onNodeClick(n => { showDetail(n); ripple(n); });
        G.onBackgroundClick(() => { hideDetail(); clearRipple(); });
        // V2: Isometric view to show spherical shell structure
        G.cameraPosition({ x: 450, y: 200, z: 300 }, { x: 0, y: 0, z: 0 }, 0);
        window.addEventListener('resize', () => { G.width(innerWidth); G.height(innerHeight); });

        // ── WASD keyboard controls ──
        const keys = {};
        document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
        document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

        // ── onEngineTick: lighting + WASD + breathing ──
        let _lightsBoosted = false;
        G.onEngineTick(() => {
            const cam = G.camera();
            if (!cam) return;

            // Boost scene lighting (once) — tuned for porcelain background
            if (!_lightsBoosted) {
                const scene = G.scene();
                if (scene) {
                    scene.children.forEach(c => {
                        if (c.type === 'AmbientLight' || (c.constructor && c.constructor.name === 'AmbientLight')) {
                            c.intensity = 1.6;
                            c.color.setHex(0xffffff);
                        }
                        if (c.type === 'DirectionalLight' || (c.constructor && c.constructor.name === 'DirectionalLight')) {
                            c.intensity = 1.2;
                            c.color.setHex(0xffffff);
                        }
                        if (c.type === 'HemisphereLight' || (c.constructor && c.constructor.name === 'HemisphereLight')) {
                            c.intensity = 1.0;
                        }
                    });
                    _lightsBoosted = true;
                }
            }

            // WASD movement (toggleable; ignored while typing in search)
            if (_wasd && document.activeElement && document.activeElement.id !== 'search') {
            cam.updateMatrixWorld();
            const e = cam.matrixWorld.elements;
            const fx = -e[8], fy = -e[9], fz = -e[10];
            const rx = e[0], ry = e[1], rz = e[2];
            const spd = 3.0;

            let dx = 0, dy = 0, dz = 0;
            if (keys['w'] || keys['arrowup'])    { dx += fx; dy += fy; dz += fz; }
            if (keys['s'] || keys['arrowdown'])   { dx -= fx; dy -= fy; dz -= fz; }
            if (keys['a'] || keys['arrowleft'])   { dx -= rx; dy -= ry; dz -= rz; }
            if (keys['d'] || keys['arrowright'])  { dx += rx; dy += ry; dz += rz; }
            if (keys['q']) dy -= 1;
            if (keys['e']) dy += 1;

            const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
            if (len > 0.001) {
                cam.position.x += (dx / len) * spd;
                cam.position.y += (dy / len) * spd;
                cam.position.z += (dz / len) * spd;
            }
            } // end _wasd guard

            // Auto-rotate around Y axis (toggle with [Auto Rotate] button)
            if (_autoRotate) {
                const cx = cam.position.x, cz = cam.position.z;
                const angle = 0.003;
                cam.position.x = cx * Math.cos(angle) - cz * Math.sin(angle);
                cam.position.z = cx * Math.sin(angle) + cz * Math.cos(angle);
                cam.lookAt(0, 0, 0);
            }

            // Breathing animation: gentle ±4% pulse on degree-based sizes
            // (sizeVal reads live mode — no stale cache across mode switches)
            const t = Date.now() * 0.001;
            const pulse = 1.0 + 0.04 * Math.sin(t * Math.PI);
            const gd = G.graphData();
            if (gd && gd.nodes) {
                gd.nodes.forEach(n => { n.val = sizeVal(n) * pulse; });
            }

        });
    }

    /* ─── Ripple ──────────────────────────────────────────────────── */
    function ripple(node) {
        clearRipple();
        const id = node.id, gd = G.graphData();
        if (!gd) return;
        const dist = new Map(), q = [{i:id,d:0}], vs = new Set([id]);
        while (q.length) {
            const {i,d} = q.shift(); dist.set(i,d);
            if (d<5) (ADJ.get(i)||[]).forEach(nid => { if (!vs.has(nid)) { vs.add(nid); q.push({i:nid,d:d+1}); } });
        }
        gd.nodes.forEach(n => { n._r = dist.has(n.id)?dist.get(n.id):99; n._h = false; });
        document.getElementById('rbtn').style.display = 'block';
        if (rT) clearTimeout(rT);
        rT = setTimeout(clearRipple, 5000);

        // Create diffusion ring animation at click position
        createRippleRing(node);
    }

    function createRippleRing(node) {
        // Project 3D position to 2D screen coordinates
        const canvas = document.querySelector('#graph-container canvas');
        if (!canvas) return;

        const camera = G.camera();
        const pos = node;
        if (!camera || pos.x == null) return;

        // Simple 3D to 2D projection
        const width = canvas.width;
        const height = canvas.height;
        const aspect = width / height;

        // Project to normalized device coordinates
        const z = pos.z || 0;
        const x = pos.x || 0;
        const y = pos.y || 0;

        // Scale based on camera distance
        const scale = 200 / (200 + z);
        const screenX = (x * scale * aspect + 1) * width / 2;
        const screenY = (-y * scale + 1) * height / 2;

        // Create ring element
        const ring = document.createElement('div');
        ring.className = 'ripple-ring';
        ring.style.left = screenX + 'px';
        ring.style.top = screenY + 'px';
        document.body.appendChild(ring);

        // Remove after animation
        setTimeout(() => ring.remove(), 1200);
    }
    function clearRipple() {
        // Reset ripple state on both current and full datasets
        const gd = G && G.graphData();
        if (gd && gd.nodes) gd.nodes.forEach(n => { n._r = null; });
        ND.forEach(n => { n._r = null; });
        document.getElementById('rbtn').style.display = 'none';
    }

    /* ─── Detail ──────────────────────────────────────────────────── */
    function showDetail(n) {
        const e = document.getElementById('detail');
        document.getElementById('dn').textContent = n.name||n.id;
        const lbs = n.labels||{};
        document.getElementById('dl').innerHTML = ['zh','en','de']
            .filter(l=>lbs[l]).map(l=>'<span style="margin:0 2px">'+l.toUpperCase()+': '+lbs[l]+'</span>').join('');
        const lv = n.level||'college', lc = LV[lv]||LV.college;
        document.getElementById('dm').innerHTML = '<span style="color:'+lc.c+'">'+lc.l+'</span> · '+(n.group||'general')+' · '+((n.source_count||1)+' '+i18n.tr('sources'));

        // ── Compute node-level metrics ──
        const gd = G.graphData();
        let connections = 0, neighbors = [];
        if (gd) {
            const id = n.id;
            gd.links.forEach(l => {
                const s = typeof l.source==='object'?l.source.id:l.source;
                const t = typeof l.target==='object'?l.target.id:l.target;
                if (s===id || t===id) {
                    connections++;
                    const oid = s===id ? t : s;
                    const on = gd.nodes.find(nn=>nn.id===oid);
                    if (on) neighbors.push(on.name);
                }
            });
        }

        // HDS depth (prerequisite chain)
        let hdsDepth = 0;
        if (gd) {
            const adj = {};
            gd.nodes.forEach(nn => adj[nn.id] = new Set());
            gd.links.forEach(l => {
                const s = typeof l.source==='object'?l.source.id:l.source;
                const t = typeof l.target==='object'?l.target.id:l.target;
                if ((l.type||'')==='prerequisite'||(l.type||'')==='requires') { adj[s].add(t); }
            });
            const visited = new Set([n.id]), queue = [{id:n.id,d:0}];
            while (queue.length) {
                const {id,d}=queue.shift(); hdsDepth=Math.max(hdsDepth,d);
                adj[id].forEach(nbid=>{if(!visited.has(nbid)){visited.add(nbid);queue.push({id:nbid,d:d+1});}});
            }
        }

        // Node role classification
        const avgDegree = gd ? (2 * gd.links.length / gd.nodes.length) : 6.2;
        let role = i18n.tr('role.intermediate'); let roleColor = '#60a5fa';
        if (hdsDepth >= 3) { role = i18n.tr('role.prerequisite_chain'); roleColor = '#22d3ee'; }
        else if (connections > avgDegree * 2) { role = i18n.tr('role.hub'); roleColor = '#f59e0b'; }
        else if (connections <= 2) { role = i18n.tr('role.peripheral'); roleColor = '#6b7280'; }

        // Auto-generated insight
        const lvOrder = {elementary:1, middle:2, high:3, college:4};
        const lev = lvOrder[lv]||3;
        let insight = '';
        if (role === i18n.tr('role.hub')) insight = i18n.tr('insight.hub');
        else if (role === i18n.tr('role.prerequisite_chain')) insight = i18n.tr('insight.chain', {depth: hdsDepth});
        else if (role === i18n.tr('role.peripheral')) insight = i18n.tr('insight.peripheral');
        else insight = i18n.tr('insight.balanced');

        const lvDesc = i18n.tr('desc.'+lv);

        // Render metrics
        const uniqueNbrs = [...new Set(neighbors)]; const topNbrs = uniqueNbrs.slice(0,5);
        const nbrHtml = topNbrs.length ? '<div class="row"><span class="label">'+i18n.tr('detail.connected_to')+'</span><span class="val">'+topNbrs.join(', ')+(uniqueNbrs.length>5?', +'+(uniqueNbrs.length-5):'')+'</span></div>' : '';

        // Portal cross-link: chain → Finding B, hub → Finding A, else → Finding C
        const fanchor = (role === i18n.tr('role.prerequisite_chain')) ? 'finding-b'
            : (role === i18n.tr('role.hub') ? 'finding-a-content' : 'finding-c');
        const fkey = fanchor === 'finding-b' ? 'b' : (fanchor === 'finding-a-content' ? 'a' : 'c');

        // LDS textbook values are mathematics-pipeline only — hidden on physics
        const ldsRows = (graph === 'physics')
            ? '<div class="row"><span class="label">'+i18n.tr('detail.graph_level')+'</span><span class="val" style="font-weight:400">'+i18n.tr('detail.no_lds')+'</span></div>'
            : '<div class="row"><span class="label">'+i18n.tr('detail.lds_zhen')+'</span><span class="val">0.934</span></div>'+
              '<div class="row"><span class="label">'+i18n.tr('detail.lds_zhde')+'</span><span class="val">0.519</span></div>'+
              '<div class="row"><span class="label">'+i18n.tr('detail.lds_ende')+'</span><span class="val">0.938</span></div>'+
              '<div class="row"><span class="label">'+i18n.tr('detail.graph_level')+'</span><span class="val" style="font-weight:400">'+i18n.tr('detail.graph_level_v')+'</span></div>';

        document.getElementById('dmetrics').innerHTML =
            '<div style="margin-bottom:3px;font-size:.6rem;color:#7a9aff;font-weight:500">'+i18n.tr('detail.node.profile')+'</div>'+
            '<div class="row"><span class="label">'+i18n.tr('detail.degree')+'</span><span class="val">'+connections+' '+i18n.tr('connections')+'</span></div>'+nbrHtml+
            '<div class="row"><span class="label">'+i18n.tr('detail.role')+'</span><span class="val" style="color:'+roleColor+'">'+role+'</span></div>'+
            '<div class="row"><span class="label">'+i18n.tr('detail.hds_depth')+'</span><span class="val">'+hdsDepth+' '+i18n.tr('levels')+'</span></div>'+
            '<div class="row"><span class="label">'+i18n.tr('detail.sources')+'</span><span class="val">'+(n.source_count||1)+' '+i18n.tr('textbooks')+'</span></div>'+
            '<div class="row"><span class="label">'+i18n.tr('detail.finding')+'</span><span class="val"><a href="../portal/index.html#'+fanchor+'" target="_blank" style="color:#1e3a8a">'+i18n.tr('finding.'+fkey)+'</a> · <a href="#" id="focusBtn" style="color:#1e3a8a">'+i18n.tr('detail.focus')+'</a></span></div>'+
            '<div style="margin:5px 0 3px;font-size:.6rem;color:#7a9aff;font-weight:500">'+i18n.tr('detail.graph.profile', {count: (gd?gd.nodes.length:556)})+'</div>'+
            '<div class="row"><span class="label">'+i18n.tr('detail.cds')+'</span><span class="val">'+((gd?2*gd.links.length/(gd.nodes.length*(gd.nodes.length-1)):0.0215)).toFixed(4)+'</span></div>'+
            '<div class="row"><span class="label">'+i18n.tr('detail.avg_degree')+'</span><span class="val">'+avgDegree.toFixed(1)+'</span></div>'+
            ldsRows;
        document.getElementById('focusBtn').addEventListener('click', function(ev){ ev.preventDefault(); focusNode(n); });

        document.getElementById('dnote').innerHTML =
            '<div style="margin-bottom:2px;font-weight:500;color:#7a9aff">'+i18n.tr('detail.about')+'</div>'+
            '<em>'+lvDesc+'.</em><br><br>'+
            '<em>'+insight+'</em><br><br>'+
            '<em>'+i18n.tr('def.cds')+'<br>'+i18n.tr('def.hds')+'<br>'+i18n.tr('def.lds')+'</em>';

        const refs = n.cross_references||[];
        document.getElementById('dr').innerHTML = refs.length?refs.slice(0,3).map(r=>'<span style="color:#3a3a5a">'+(r.textbook||'')+(r.section?' §'+r.section:'')+'</span>').join('<br>'):'';
        e.style.display = 'block';
        clearTimeout(e._t); e._t = setTimeout(hideDetail, 20000);
    }
    function hideDetail() { document.getElementById('detail').style.display = 'none'; }

    /* ─── View Mode ───────────────────────────────────────────────── */
    function setMode(m) {
        mode = m;
        document.getElementById('mode-tag').textContent = i18n.tr('mode.'+m);
        if (!G) return;

        // Dynamic view update: re-create graph data with mode-specific values
        let fn, fl;
        if (lang === 'all') {
            fn = ND; fl = LK;
        } else {
            const ids = new Set();
            ND.forEach(n => { const lbs = n.labels || {}; if (lbs[lang]) ids.add(n.id); });
            fn = ND.filter(n => ids.has(n.id));
            fl = LK.filter(link => {
                const s = typeof link.source === 'object' ? link.source.id : link.source;
                const t = typeof link.target === 'object' ? link.target.id : link.target;
                return ids.has(s) && ids.has(t);
            });
        }

        // Degree-based sizes; Space-Fill pins nodes to education-level shells
        fn.forEach(n => {
            n.color = colorCB(n);
            n.val = sizeVal(n);
            if (m === 'spacefill' && n.sx != null) { n.fx = n.sx; n.fy = n.sy; n.fz = n.sz; }
            else { n.fx = undefined; n.fy = undefined; n.fz = undefined; }
        });
        refreshModeCap();

        // Re-load graph data with colors and sizes baked in
        G.nodeColor('color')
         .nodeVal('val')
         .nodeRelSize(8)
         .nodeOpacity(1)
         .linkWidth(0.35)
         .linkOpacity(0.35)
         .linkDirectionalParticles(0)
         .graphData({ nodes: fn, links: fl });

        // Update HUD
        document.getElementById('sub').textContent = i18n.tr('hud.subtitle', {concepts: fn.length, relations: fl.length});
    }

    /* ─── Language Filter (graph only — UI language has its own switcher) ── */
    function setLang(l) {
        lang = l;
        if (!G) return;

        // Save camera position before filter
        const cam = G.camera();
        const savedPos = cam ? { x: cam.position.x, y: cam.position.y, z: cam.position.z } : null;

        let fn, fl;
        if (l === 'all') {
            // Restore full dataset from originals
            fn = ND;
            fl = LK;
        } else {
            // Filter: only nodes with the selected language label
            const ids = new Set();
            ND.forEach(n => {
                const lbs = n.labels || {};
                if (lbs[l]) ids.add(n.id);
            });
            fn = ND.filter(n => ids.has(n.id));
            // Keep only links where BOTH ends are in the filter
            fl = LK.filter(link => {
                const s = typeof link.source === 'object' ? link.source.id : link.source;
                const t = typeof link.target === 'object' ? link.target.id : link.target;
                return ids.has(s) && ids.has(t);
            });
        }
        G.graphData({ nodes: fn, links: fl });

        // Restore camera position after filter
        if (savedPos) {
            setTimeout(() => {
                G.cameraPosition(savedPos, { x: 0, y: 0, z: 0 }, 0);
            }, 50);
        }

        // Update HUD with filter count
        const sub = document.getElementById('sub');
        if (l === 'all') {
            sub.textContent = i18n.tr('hud.subtitle', {concepts: ND.length, relations: fl.length});
        } else {
            sub.textContent = i18n.tr('hud.filtered', {shown: fn.length, concepts: ND.length, relations: fl.length});
        }
    }

    /* ─── Mode caption ────────────────────────────────────────── */
    function refreshModeCap() {
        const el = document.getElementById('modeCap');
        if (el) el.textContent = i18n.tr('modecap.' + mode);
    }

    /* ─── About panel (innerHTML — i18n.apply uses textContent) ── */
    function refreshAbout() {
        const el = document.querySelector('[data-i18n="about.body"]');
        if (el) el.innerHTML = i18n.tr(graph === 'physics' ? 'about.body_physics' : 'about.body');
    }

    /* ─── UI ──────────────────────────────────────────────────────── */
    function mkUI() {
        document.querySelectorAll('[data-m]').forEach(b => {
            b.addEventListener('click', ()=>{
                document.querySelectorAll('[data-m]').forEach(x=>x.classList.remove('a'));
                b.classList.add('a'); setMode(b.dataset.m);
            });
        });
        document.querySelectorAll('[data-g]').forEach(b => {
            b.addEventListener('click', ()=>{
                document.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('a'));
                b.classList.add('a'); setLang(b.dataset.g);
            });
        });
        document.querySelectorAll('[data-d]').forEach(b => {
            b.addEventListener('click', ()=>{ switchGraph(b.dataset.d); });
        });
        document.getElementById('rbtn').addEventListener('click', ()=>{
            hideDetail(); clearRipple(); setLang('all');
            document.querySelectorAll('[data-g]').forEach(x=>x.classList.remove('a'));
            document.querySelector('[data-g="all"]').classList.add('a');
        });
        // Auto Rotate toggle
        document.getElementById('arBtn').addEventListener('click', function() {
            _autoRotate = !_autoRotate;
            this.dataset.ar = _autoRotate ? 'on' : 'off';
            this.classList.toggle('a', _autoRotate);
        });
        // WASD toggle
        const wasdBtn = document.getElementById('wasdBtn');
        window.__paintWasd = function() {
            wasdBtn.classList.toggle('a', _wasd);
            wasdBtn.textContent = i18n.tr(_wasd ? 'wasd.on' : 'wasd.off');
        };
        wasdBtn.addEventListener('click', function() { _wasd = !_wasd; window.__paintWasd(); });
        // UI language switcher (independent from graph filter)
        document.querySelectorAll('[data-u]').forEach(b => {
            b.addEventListener('click', ()=>{
                document.querySelectorAll('[data-u]').forEach(x=>x.classList.remove('a'));
                b.classList.add('a');
                i18n.setLanguage(b.dataset.u);
                i18n.apply();
                refreshAbout(); refreshModeCap(); window.__paintWasd(); refreshCounts();
                document.getElementById('mode-tag').textContent = i18n.tr('mode.'+mode);
            });
        });
        // About panel
        const about = document.getElementById('about');
        document.getElementById('aboutBtn').addEventListener('click', () => {
            refreshAbout();
            about.style.display = about.style.display === 'block' ? 'none' : 'block';
        });
        document.getElementById('aboutClose').addEventListener('click', () => { about.style.display = 'none'; });
        // Search
        const searchBox = document.getElementById('search');
        const searchMeta = document.getElementById('searchMeta');
        function matchNodes(q){
            q = (q || '').trim().toLowerCase();
            if (!q) return [];
            return ND.filter(n => {
                const lbs = n.labels || {};
                return (n.name || '').toLowerCase().indexOf(q) >= 0 ||
                    Object.keys(lbs).some(l => (lbs[l] || '').toLowerCase().indexOf(q) >= 0);
            }).slice(0, 6);
        }
        searchBox.addEventListener('input', () => {
            const ms = matchNodes(searchBox.value);
            searchMeta.innerHTML = '';
            if (!searchBox.value.trim()) return;
            if (!ms.length) { searchMeta.textContent = i18n.tr('search.none'); return; }
            ms.forEach(n => {
                const b = document.createElement('button');
                b.textContent = n.name || n.id;
                b.addEventListener('click', () => focusNode(n));
                searchMeta.appendChild(b);
                searchMeta.appendChild(document.createTextNode(' '));
            });
        });
        searchBox.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const ms = matchNodes(searchBox.value);
                if (ms.length) focusNode(ms[0]);
            }
        });
    }

    /* ─── Helpers: counts / caption / about / focus ───────────── */
    function refreshCounts(){
        if (!G) return;
        const gd = G.graphData();
        const fn = gd ? gd.nodes.length : ND.length, fl = gd ? gd.links.length : LK.length;
        document.getElementById('sub').textContent = (lang === 'all')
            ? i18n.tr('hud.subtitle', {concepts: ND.length, relations: fl})
            : i18n.tr('hud.filtered', {shown: fn, concepts: ND.length, relations: fl});
    }
    function focusNode(n) {
        showDetail(n);
        ripple(n);
        if (!G || n.x == null) return;
        const r = Math.hypot(n.x || 0, n.y || 0, n.z || 0) || 200;
        const f = (r + 150) / r;
        G.cameraPosition({ x: (n.x || 0) * f, y: (n.y || 0) * f, z: (n.z || 0) * f },
            { x: n.x || 0, y: n.y || 0, z: n.z || 0 }, 900);
    }

    /* ─── Start ───────────────────────────────────────────────────── */
    if (document.readyState === 'complete') init();
    else window.addEventListener('load', init);
    })();
    </script>
</body>
