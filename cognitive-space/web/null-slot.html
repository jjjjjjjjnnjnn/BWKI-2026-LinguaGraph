<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Null-Slot — Toy-Demo der Null-Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Noto+Serif+SC:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --surface:#f1f3f5; --surface2:#f8fafc; --text:#0a1f3d; --text2:#4a5a78; --rule:#c6cdd6; --accent:#1e3a8a; --pink:#ec4899; --teal:#0e7490; --amber:#f59e0b; --violet:#7c3aed; --green:#1e7e4d; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"IBM Plex Sans","Noto Sans SC",sans-serif; background:var(--surface); color:var(--text); }
.stage { min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:120px 20px 90px; gap:18px; }
.machine { width:640px; max-width:94vw; background:var(--surface2); border:1px solid var(--rule); border-radius:14px; box-shadow:0 18px 48px rgba(10,31,61,.12); padding:22px 24px 18px; }
.machine h2 { font-family:"Playfair Display","Noto Serif SC",Georgia,serif; font-weight:500; font-size:1.35rem; margin-bottom:4px; }
.machine h2 em { font-style:italic; color:var(--pink); }
.histcap { font-size:.68rem; color:var(--text2); margin-top:8px; }
.hist { position:relative; background:#0a1f3d; border-radius:10px; margin:8px 0 6px; padding:30px 12px 26px; overflow:hidden; }
.plot { position:relative; }
.bins { display:flex; align-items:flex-end; gap:2px; height:132px; border-bottom:1px solid #33507e; position:relative; z-index:1; }
.bin { flex:1 1 0; background:linear-gradient(180deg,#67e8f9,var(--teal)); border-radius:3px 3px 0 0; height:0%; min-height:2px; transition:height 120ms ease; }
.marker { position:absolute; top:-24px; bottom:22px; width:2px; background:var(--pink); z-index:2; }
.marker small { position:absolute; top:-4px; left:5px; font-family:"IBM Plex Mono",monospace; font-size:.58rem; color:#f9a8d4; white-space:nowrap; background:rgba(10,31,61,.75); padding:1px 5px; border-radius:4px; }
.tick { position:absolute; top:-24px; bottom:22px; width:2px; background:var(--violet); opacity:.9; z-index:2; }
.tick small { position:absolute; top:12px; left:4px; font-family:"IBM Plex Mono",monospace; font-size:.54rem; color:#c4b5fd; white-space:nowrap; }
.haxis { display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:.56rem; color:#9db2cc; margin-top:5px; }
.haxislab { font-family:"IBM Plex Mono",monospace; font-size:.56rem; color:#9db2cc; margin-top:2px; text-align:center; }
.hempty { position:absolute; inset:30px 12px 46px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:.68rem; color:#cbd5e1; z-index:3; pointer-events:none; padding:0 20px; line-height:1.6; }
.leverrow { display:flex; align-items:center; gap:16px; margin:10px 0 4px; }
.lever { width:34px; height:96px; background:#dbe2ea; border:1px solid var(--rule); border-radius:17px; position:relative; cursor:pointer; flex:0 0 auto; }
.lever .knob { position:absolute; left:50%; top:6px; transform:translateX(-50%); width:24px; height:24px; border-radius:50%; background:var(--pink); box-shadow:0 3px 0 #9d2462; transition:top 120ms ease; }
.lever.down .knob { top:62px; }
.pullbtn { font-family:inherit; font-weight:600; font-size:.95rem; color:#fff; background:var(--accent); border:1px solid var(--accent); border-radius:8px; padding:13px 30px; cursor:pointer; transition:transform 120ms ease, background 120ms ease; }
.pullbtn:hover { background:var(--text); }
.pullbtn:active { transform:translateY(1px) scale(.99); }
.counters { display:flex; gap:18px; font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--text2); flex-wrap:wrap; }
.counters b { color:var(--text); font-size:.85rem; }
.punch { font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--text); background:#eef4ff; border:1px solid var(--accent); border-radius:8px; padding:9px 12px; margin-top:8px; line-height:1.6; }
.punch b { color:var(--accent); }
.t1strip { display:flex; align-items:center; gap:10px; font-family:"IBM Plex Mono",monospace; font-size:.64rem; color:var(--text2); background:#fdf6ec; border:1px dashed var(--amber); border-radius:8px; padding:8px 12px; margin-top:8px; flex-wrap:wrap; }
.t1strip .t1bar { height:12px; border-radius:4px; display:inline-block; vertical-align:middle; }
.honest { font-size:.66rem; color:var(--text2); line-height:1.6; border-left:3px solid var(--amber); padding-left:10px; margin-top:10px; }
.honest b { color:var(--text); }
.method { width:640px; max-width:94vw; background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:8px; font-size:.62rem; color:var(--text2); }
.method summary { cursor:pointer; padding:10px 14px; font-weight:600; color:var(--accent); }
.method .msec { padding:0 14px 10px; line-height:1.6; }
.method .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.58rem; }
.hud { position:absolute; top:16px; left:16px; z-index:10; background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:8px; padding:12px 14px; max-width:370px; box-shadow:0 1px 0 var(--rule),0 18px 48px rgba(10,31,61,.18); }
.hud h1 { font-family:"Playfair Display","Noto Serif SC",Georgia,serif; font-size:.95rem; font-weight:500; }
.hud h1 span { color:var(--pink); font-style:italic; }
.hud .sub { font-size:.6rem; color:var(--text2); margin-top:4px; line-height:1.55; }
.nav { position:absolute; top:16px; right:16px; z-index:10; display:flex; gap:6px; }
.nav a, .nav button { font-size:.62rem; color:var(--accent); background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:6px; padding:6px 12px; text-decoration:none; cursor:pointer; font-family:inherit; font-weight:600; }
.nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.scope { position:fixed; bottom:12px; left:16px; z-index:10; font-size:.56rem; color:var(--text2); font-family:ui-monospace,Menlo,Consolas,monospace; max-width:62vw; line-height:1.6; background:rgba(248,250,252,.9); padding:4px 8px; border-radius:6px; border:1px solid var(--rule); }
.hint { position:fixed; bottom:12px; right:16px; z-index:10; font-size:.58rem; color:var(--text2); }
@media (prefers-reduced-motion: reduce) { .lever .knob { transition:none; } .bin { transition:none; } }
</style>
</head>
<body>
<div class="hud">
  <h1>Null-Slot <span data-k="t_toy">Toy</span></h1>
  <div class="sub" data-k="sub"></div>
</div>
<div class="nav">
  <a href="../portal/cspace.html" data-k="back">← Galerie</a>
  <button data-l="en">EN</button><button data-l="de" class="active">DE</button><button data-l="zh">ZH</button>
</div>
<div class="stage">
  <div class="machine">
    <h2 data-k="m_title">Null-Modell <em>Slot Machine</em></h2>
    <div class="histcap" data-k="h_cap"></div>
    <div class="hist" id="hist">
      <div class="plot">
        <div class="marker" style="left:51.9%"><small data-k="h_real">echt 0.519</small></div>
        <div class="tick" style="left:93.3%"><small>0.933</small></div>
        <div class="tick" style="left:93.8%"><small style="top:26px">0.938</small></div>
        <div class="bins" id="bins"></div>
      </div>
      <div class="haxis"><span>0.0</span><span>0.2</span><span>0.4</span><span>0.6</span><span>0.8</span><span>1.0</span></div>
      <div class="haxislab" data-k="h_axis"></div>
      <div class="hempty" id="hempty" data-k="h_empty"></div>
    </div>
    <div class="leverrow">
      <div class="lever" id="lever" role="button" tabindex="0" aria-label="pull"><div class="knob"></div></div>
      <button class="pullbtn" id="pull" data-k="pull">Hebel ziehen</button>
      <div class="counters">
        <span><span data-k="c_pulls">Züge (N/500)</span>: <b id="nPulls">0/500</b></span>
        <span><span data-k="c_beats">beats the real</span>: <b id="nBeats">0</b></span>
        <span><span data-k="c_seed">Demo-Seed</span>: <b id="nSeed">—</b></span>
      </div>
    </div>
    <div class="punch" id="punch"></div>
    <div class="t1strip"><span data-k="l_t1">T1-Entgiftung (frozen): J</span><span class="t1bar" style="width:111px;background:var(--amber)"></span><b>0.556</b><span>→</span><span class="t1bar" style="width:8px;background:var(--green)"></span><b>0.020</b><span data-k="l_frozen"></span></div>
    <div class="honest" data-k="honest"></div>
  </div>
  <details class="method">
    <summary data-k="m_sum"></summary>
    <div class="msec"><p data-k="m_how"></p></div>
    <div class="msec"><p class="mono" data-k="m_src"></p></div>
  </details>
</div>
<div class="scope" data-k="scope"></div>
<div class="hint" data-k="hint"></div>
<script>
var REAL = { zhde: 0.519, zhen: 0.933, deen: 0.938, t1a: 0.556, t1b: 0.020 };
var NBINS = 20;
var T = {
de: { t_toy:'Toy', back:'← Galerie',
  sub:'Ziehe den Hebel: Jeder Zug wirft EINEN Toy-Nullwert in die wachsende Verteilung (Seed-RNG). Die echte LDS 0.519 bleibt als Linie fixiert — weit weg vom Null-Bulk. Zähle bis 500 wie die echte Suite.',
  m_title:'Null-Modell <em>Slot Machine</em>', pull:'Hebel ziehen', c_pulls:'Züge (N/500)', c_beats:'beats the real', c_seed:'Demo-Seed',
  h_cap:'Null-Verteilung (Toy) — ein Wert pro Zug, x-Achse 0.0 … 1.0', h_real:'echt 0.519', h_axis:'Toy-Null-LDS über 0.0 … 1.0 · echte Linie bei 0.519',
  h_empty:'Ziehe den Hebel — jeder Zug wirft EINEN Toy-Nullwert in die Verteilung.',
  l_t1:'T1-Entgiftung (frozen): J', l_frozen:'· 219 Gruppen · 500 Perm. · p<0.004 · Boden 0.033',
  punch:'p ≈ {b}/{n} = {p} — gezählt, nicht berechnet',
  honest:'<b>Ehrlich-Etikett:</b> Spielzeug-Demo der echten Null-Suite, NICHT die Suite selbst. Jeder Balkenstapel ist Zufall pro Zug (Seed unten); die Linie 0.519 und alle Textzahlen sind eingefroren: LDS-K 0.519 / 0.933 / 0.938, T1 J 0.556 → 0.020, 219 Gruppen, 500 Permutationen, p &lt; 0.004, Boden 0.033. Punchline zählt nur: beats/Züge.',
  scope:'SCOPE · Toy-Demo der Null-Suite (nicht die Suite) · frozen: LDS-K 0.519/0.933/0.938 · T1 J 0.556→0.020 · 219 Gruppen · 500 Perm., p<0.004, Boden 0.033 · research/numbers_ssot_20260916.json + Portal finding_cx / falsification-probe',
  hint:'ziehen · Verteilung wachsen sehen', m_sum:'Details · wie diese Demo funktioniert',
  m_how:'Pro Zug würfelt ein Seed-Zufallsgenerator (mulberry32, Seed = Zugnummer) genau EINEN Toy-Nullwert (0.80–0.98, gerundet auf 3 Stellen) und stapelt ihn im passenden Histogramm-Balken (20 Bins über 0.0 … 1.0). Die echte Linie 0.519 bewegt sich nie; Violett-Ticks 0.933 / 0.938 geben Kontext. Zähler „N/500 beats the real“, Punchline p ≈ beats/Züge — gezählt, nicht berechnet. Reduzierte Bewegung wird respektiert (keine Animation).',
  m_src:'Quellen: research/numbers_ssot_20260916.json (lds_k_tier1, macro_perm, frozen_figures) · Portal finding_cx (219 Gruppen, T1 0.556→0.020) · Portal falsification-probe (500 Perm., p<0.004, Boden 0.033)' },
en: { t_toy:'Toy', back:'← Gallery',
  sub:'Pull the lever: each pull drops ONE toy null value into the growing distribution (seeded RNG). The real LDS 0.519 stays pinned as a line — far from the null bulk. Count up to 500 like the real suite.',
  m_title:'Null-Model <em>Slot Machine</em>', pull:'Pull the lever', c_pulls:'pulls (N/500)', c_beats:'beats the real', c_seed:'demo seed',
  h_cap:'Null distribution (toy) — one value per pull, x-axis 0.0 … 1.0', h_real:'real 0.519', h_axis:'toy null LDS over 0.0 … 1.0 · real line at 0.519',
  h_empty:'Pull the lever — each pull drops ONE toy null value into the distribution.',
  l_t1:'T1 decontamination (frozen): J', l_frozen:'· 219 groups · 500 perm. · p<0.004 · floor 0.033',
  punch:'p ≈ {b}/{n} = {p} — counted, not computed',
  honest:'<b>Honest label:</b> toy demo of the real null suite, NOT the suite itself. Every histogram stack is random per pull (seed below); the 0.519 line and every printed number are frozen: LDS-K 0.519 / 0.933 / 0.938, T1 J 0.556 → 0.020, 219 groups, 500 permutations, p &lt; 0.004, floor 0.033. The punchline only counts: beats/pulls.',
  scope:'SCOPE · toy demo of the null suite (not the suite) · frozen: LDS-K 0.519/0.933/0.938 · T1 J 0.556→0.020 · 219 groups · 500 perm., p<0.004, floor 0.033 · research/numbers_ssot_20260916.json + portal finding_cx / falsification-probe',
  hint:'pull · watch the distribution grow', m_sum:'Details · how this demo works',
  m_how:'Each pull rolls a seeded RNG (mulberry32, seed = pull number) for exactly ONE toy null value (0.80–0.98, rounded to 3 decimals) and stacks it in the matching histogram bin (20 bins over 0.0 … 1.0). The real line 0.519 never moves; violet ticks 0.933 / 0.938 give context. Counter “N/500 beats the real”, punchline p ≈ beats/pulls — counted, not computed. Reduced motion is respected (no animation).',
  m_src:'Sources: research/numbers_ssot_20260916.json (lds_k_tier1, macro_perm, frozen_figures) · portal finding_cx (219 groups, T1 0.556→0.020) · portal falsification-probe (500 perm., p<0.004, floor 0.033)' },
zh: { t_toy:'玩具', back:'← 展厅',
  sub:'拉杆：每拉一次，向不断增长的分布中投入一个玩具零值（种子随机数）。真值 LDS 0.519 固定为一条线——远离零堆。像真实套件一样数到 500。',
  m_title:'零模型<em>槽机</em>', pull:'拉杆', c_pulls:'拉动次数（N/500）', c_beats:'击败真值', c_seed:'演示种子',
  h_cap:'零分布（玩具）——每轮一个值，x 轴 0.0 … 1.0', h_real:'真值 0.519', h_axis:'玩具零 LDS（0.0 … 1.0）· 真线在 0.519',
  h_empty:'拉杆——每拉一次，向分布中投入一个玩具零值。',
  l_t1:'T1 去污染（冻结）：J', l_frozen:'· 219 组 · 500 置换 · p<0.004 · 地板值 0.033',
  punch:'p ≈ {b}/{n} = {p} —— 数出来的，不是算出来的',
  honest:'<b>诚实标签：</b>这是真实零模型套件的玩具演示，不是套件本身。每根柱子都是每轮随机数（种子见下）；0.519 线与所有文字数字均为冻结值：LDS-K 0.519 / 0.933 / 0.938，T1 J 0.556 → 0.020，219 组，500 置换，p &lt; 0.004，地板值 0.033。 punchline 只计数：beats/拉动次数。',
  scope:'口径 · 零模型套件的玩具演示（非套件本身）· 冻结：LDS-K 0.519/0.933/0.938 · T1 J 0.556→0.020 · 219 组 · 500 置换，p<0.004，地板 0.033 · research/numbers_ssot_20260916.json + 门户 finding_cx / falsification-probe',
  hint:'拉杆 · 看分布增长', m_sum:'详细 · 这个演示怎么工作',
  m_how:'每拉一次，种子随机数（mulberry32，种子＝拉动序号）只生成一个玩具零值（0.80–0.98，保留 3 位小数），堆进对应的直方图柱（0.0 … 1.0 上 20 个柱）。真线 0.519 永远不动；紫色刻度 0.933 / 0.938 提供背景。计数“N/500 击败真值”，punchline 为 p ≈ beats/拉动次数——数出来的，不是算出来的。尊重减少动态偏好（无动画）。',
  m_src:'来源：research/numbers_ssot_20260916.json（lds_k_tier1、macro_perm、frozen_figures）· 门户 finding_cx（219 组，T1 0.556→0.020）· 门户 falsification-probe（500 置换，p<0.004，地板 0.033）' }
};
var lang = 'de';
try {
  lang = localStorage.getItem('viz_lang') || localStorage.getItem('cspace_lang') || localStorage.getItem('portal_lang') || null;
  if (!lang) { var nv = (navigator.language || 'de').toLowerCase(); lang = nv.indexOf('zh') === 0 ? 'zh' : (nv.indexOf('en') === 0 ? 'en' : 'de'); }
} catch (e) { lang = 'de'; }
if (!T[lang]) lang = 'de';
var pulls = 0, beats = 0, maxC = 0;
var counts = new Array(NBINS);
for (var ci = 0; ci < NBINS; ci++) counts[ci] = 0;
var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var binsEl = document.getElementById('bins');
var binDivs = [];
(function buildBins() {
  for (var i = 0; i < NBINS; i++) {
    var d = document.createElement('div');
    d.className = 'bin';
    d.style.height = '0%';
    binsEl.appendChild(d);
    binDivs.push(d);
  }
})();
function rng32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function renderBins() {
  for (var i = 0; i < NBINS; i++) {
    var h = maxC > 0 ? (counts[i] / maxC * 100) : 0;
    binDivs[i].style.height = (counts[i] > 0 ? Math.max(4, h) : 0) + '%';
    var lo = (i / NBINS).toFixed(2), hi = ((i + 1) / NBINS).toFixed(2);
    binDivs[i].title = lo + '–' + hi + ': ' + counts[i];
  }
}
function renderPunch() {
  var t = T[lang].punch;
  var p = pulls > 0 ? (beats / pulls).toFixed(3) : '—';
  var s = t.split('{b}').join(String(beats)).split('{n}').join(String(pulls)).split('{p}').join(p);
  document.getElementById('punch').innerHTML = '<b>' + s + '</b>';
}
function setL(l) {
  lang = T[l] ? l : 'de';
  try { localStorage.setItem('viz_lang', lang); } catch (e) {}
  var t = T[lang];
  document.querySelectorAll('[data-k]').forEach(function (elm) {
    var k = elm.getAttribute('data-k');
    if (t[k] !== undefined) elm.innerHTML = t[k];
  });
  document.querySelectorAll('.nav button[data-l]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-l') === lang); });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  renderPunch();
}
document.querySelectorAll('.nav button[data-l]').forEach(function (b) {
  b.addEventListener('click', function () { setL(b.getAttribute('data-l')); });
});
function pull() {
  pulls++;
  var r = rng32(pulls);
  var v = 0.80 + r() * 0.18;
  v = Math.round(v * 1000) / 1000;
  if (v > 0.999) v = 0.999;
  var b = Math.min(NBINS - 1, Math.floor(v * NBINS));
  counts[b]++;
  if (counts[b] > maxC) maxC = counts[b];
  renderBins();
  if (v <= REAL.zhde) beats++;
  document.getElementById('nPulls').textContent = pulls + '/500';
  document.getElementById('nBeats').textContent = String(beats);
  document.getElementById('nSeed').textContent = '#' + pulls;
  document.getElementById('hempty').style.display = 'none';
  renderPunch();
  var lv = document.getElementById('lever');
  lv.classList.add('down');
  setTimeout(function () { lv.classList.remove('down'); }, reduced ? 0 : 160);
}
document.getElementById('pull').addEventListener('click', pull);
var lever = document.getElementById('lever');
lever.addEventListener('click', pull);
lever.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pull(); } });
setL(lang);
renderBins();
renderPunch();
</script>
</body>
</html>
