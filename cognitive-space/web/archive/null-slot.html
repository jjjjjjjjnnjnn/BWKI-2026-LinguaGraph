<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Null-Slot — Zero-Model Comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Noto+Serif+SC:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg:#f1f3f5; --surface:#f8fafc; --text:#0a1f3d; --text2:#4a5a78; --accent:#1e3a8a; --border:#c6cdd6; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"IBM Plex Sans","Noto Sans SC",sans-serif; background:var(--bg); color:var(--text); }
.nav { position:absolute; top:16px; right:16px; z-index:10; display:flex; gap:6px; }
.nav a, .nav button { font-size:.62rem; color:var(--accent); background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:6px 12px; text-decoration:none; cursor:pointer; font-family:inherit; font-weight:600; transition:background 160ms ease, transform 160ms ease; }
.nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.nav a:active, .nav button:active { transform:scale(.97); }
.wrap { max-width:720px; margin:0 auto; padding:96px 20px 80px; display:flex; flex-direction:column; gap:16px; }
.mast h1 { font-family:"Playfair Display","Noto Serif SC",Georgia,serif; font-weight:500; font-size:1.9rem; }
.mast .sub { font-size:.78rem; color:var(--text2); margin-top:6px; line-height:1.6; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:18px 20px; }
.tag { font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--accent); font-weight:500; margin-bottom:6px; }
.card h2 { font-family:"Playfair Display","Noto Serif SC",Georgia,serif; font-weight:500; font-size:1.2rem; margin-bottom:8px; }
.card p.body { font-size:.78rem; line-height:1.65; color:var(--text); }
.ruler { position:relative; height:64px; margin:14px 0 2px; }
.track { position:absolute; left:0; right:0; top:32px; height:2px; background:var(--border); }
.rmark { position:absolute; top:6px; bottom:16px; width:2px; background:var(--accent); }
.rmark small { position:absolute; top:-2px; left:6px; font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--accent); white-space:nowrap; font-weight:500; }
.rtick { position:absolute; top:24px; bottom:16px; width:1px; background:var(--text2); opacity:.6; }
.rtick small { position:absolute; top:12px; left:4px; font-family:"IBM Plex Mono",monospace; font-size:.58rem; color:var(--text2); white-space:nowrap; }
.rtick small.low { top:26px; }
.axis { display:flex; justify-content:space-between; font-family:"IBM Plex Mono",monospace; font-size:.58rem; color:var(--text2); }
.note { font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--text); border-left:2px solid var(--accent); padding-left:10px; margin-top:12px; line-height:1.6; }
.cap { font-size:.64rem; color:var(--text2); margin-top:10px; line-height:1.6; }
.hist { position:relative; margin-top:14px; border:1px solid var(--border); border-radius:8px; padding:32px 14px 10px; background:var(--surface); }
.plot { position:relative; }
.bins { display:flex; align-items:flex-end; gap:2px; height:120px; border-bottom:1px solid var(--border); position:relative; }
.bin { flex:1 1 0; background:var(--text2); border-radius:2px 2px 0 0; height:0%; min-height:2px; transition:height 160ms ease; }
.hmark { position:absolute; top:-26px; bottom:23px; width:2px; background:var(--accent); }
.hmark small { position:absolute; top:0; left:6px; font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--accent); white-space:nowrap; font-weight:500; }
.hempty { position:absolute; inset:32px 14px 32px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:.68rem; color:var(--text2); background:rgba(248,250,252,.9); pointer-events:none; padding:0 20px; line-height:1.6; }
.dots { display:flex; flex-wrap:wrap; gap:3px; margin-top:12px; }
.dot { width:6px; height:6px; border-radius:50%; border:1px solid var(--border); }
.dot.on { background:var(--text2); border-color:var(--text2); }
.row { display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
.btn-solid { font-family:inherit; font-weight:600; font-size:.8rem; color:#fff; background:var(--accent); border:1px solid var(--accent); border-radius:8px; padding:10px 22px; cursor:pointer; transition:background 160ms ease, transform 160ms ease; }
.btn-solid:hover { background:var(--text); }
.btn-solid:active { transform:scale(.97); }
.btn-solid:disabled { opacity:.45; cursor:default; }
.btn-ghost { font-family:inherit; font-weight:600; font-size:.8rem; color:var(--accent); background:transparent; border:1px solid var(--border); border-radius:8px; padding:10px 18px; cursor:pointer; transition:transform 160ms ease, border-color 160ms ease; }
.btn-ghost:hover { border-color:var(--accent); }
.btn-ghost:active { transform:scale(.97); }
.counters { display:flex; gap:16px; font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--text2); flex-wrap:wrap; }
.counters b { color:var(--text); }
.punch { font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--text); border:1px solid var(--accent); border-radius:8px; padding:9px 12px; margin-top:12px; line-height:1.6; }
.verdict { font-family:"Playfair Display","Noto Serif SC",Georgia,serif; font-size:1.05rem; line-height:1.6; margin-top:10px; }
.verdict b { color:var(--accent); font-weight:500; }
.src { font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--text2); margin-top:10px; line-height:1.7; }
.foot { font-family:"IBM Plex Mono",monospace; font-size:.6rem; color:var(--text2); line-height:1.7; border-top:1px solid var(--border); padding-top:12px; }
@media (prefers-reduced-motion: reduce) { .bin { transition:none; } .nav a, .nav button, .btn-solid, .btn-ghost { transition:none; } }
</style>
</head>
<body>
<div class="nav">
  <a href="../portal/cspace.html" data-k="back">← Galerie</a>
  <button data-l="en">EN</button><button data-l="de" class="active">DE</button><button data-l="zh">ZH</button>
</div>
<div class="wrap">
  <header class="mast">
    <h1 data-k="title">Null-Slot</h1>
    <div class="sub" data-k="subtitle"></div>
  </header>
  <section class="card">
    <div class="tag" data-k="s1_tag"></div>
    <h2 data-k="s1_title"></h2>
    <p class="body" data-k="s1_note"></p>
    <div class="ruler">
      <div class="track"></div>
      <div class="rmark" style="left:51.9%"><small data-k="m_real">echt 0.519</small></div>
      <div class="rtick" style="left:93.3%"><small>0.933</small></div>
      <div class="rtick" style="left:93.8%"><small class="low">0.938</small></div>
    </div>
    <div class="axis"><span>0.0</span><span>0.2</span><span>0.4</span><span>0.6</span><span>0.8</span><span>1.0</span></div>
    <div class="note" data-k="s1_floor"></div>
    <p class="cap" data-k="s1_cap"></p>
  </section>
  <section class="card">
    <div class="tag" data-k="s2_tag"></div>
    <h2 data-k="s2_title"></h2>
    <p class="body" data-k="s2_body"></p>
    <div class="hist">
      <div class="plot">
        <div class="hmark" style="left:51.9%"><small data-k="m_real">echt 0.519</small></div>
        <div class="bins" id="bins"></div>
      </div>
      <div class="axis"><span>0.0</span><span>0.2</span><span>0.4</span><span>0.6</span><span>0.8</span><span>1.0</span></div>
      <p class="cap" data-k="h_axis"></p>
      <div class="hempty" id="hempty" data-k="h_empty"></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="row">
      <button class="btn-solid" id="run" data-k="run">Ausführen (500)</button>
      <button class="btn-ghost" id="reset" data-k="reset">Zurücksetzen</button>
      <div class="counters">
        <span><span data-k="draws">Züge (N/500)</span>: <b id="nDraws">0/500</b></span>
        <span><span data-k="beats_w">schlägt echt</span>: <b id="nBeats">0</b></span>
      </div>
    </div>
    <div class="punch" id="punch"></div>
  </section>
  <section class="card">
    <div class="tag" data-k="s3_tag"></div>
    <h2 data-k="s3_title"></h2>
    <div class="verdict" data-k="verdict"></div>
    <div class="src" data-k="src"></div>
  </section>
  <footer class="foot" data-k="foot"></footer>
</div>
<script>
var TRUE_V = 0.519;
var SEED = 20260914;
var N = 500, NBINS = 20, BATCH = 100, BATCH_MS = 160;
var T = {
de: { title:'Null-Slot', back:'← Galerie',
  subtitle:'Nullmodell-Vergleich — wo der wahre Wert gegen 500 Label-Permutationen steht.',
  s1_tag:'Schritt 1 · wahrer Wert', s1_title:'Lineal des wahren Werts',
  s1_note:'Eingefrorene LDS-K: ZH–DE 0.519, ZH–EN 0.933, DE–EN 0.938. Der 59-Run-Permutationstest besteht 59/59 mit Margen +0.033 bis +0.424 (Boden positiv, Details Schritt 3) — der Indigo-Marker unten ist die LDS-K-Position, keine Marge.',
  s1_floor:'Margen-Boden: +0.033 &gt; 0 — der Wert überlebt selbst seine schwächste Marge.',
  s1_cap:'Skala 0.0 … 1.0 · Indigo-Marker = ZH–DE 0.519 · graue Ticks = 0.933 / 0.938.', m_real:'echt 0.519',
  s2_tag:'Schritt 2 · Null', s2_title:'Null-Histogramm — 500 Züge',
  s2_body:'Ein Run lässt 500 Seed-gesteuerte graue Nullwerte (5 Chargen) in 20 Balken wachsen. Die Indigo-Linie bei 0.519 bewegt sich nie — sie steht außerhalb des Null-Bulks. Unten = ähnlicher als Zufall; keine Nullziehung schlägt die echte Linie, daher p = 0/500 gezählt.',
  run:'Ausführen (500)', reset:'Zurücksetzen', draws:'Züge (N/500)', beats_w:'schlägt echt',
  h_empty:'Drücke Ausführen — 500 graue Nullwerte stapeln sich in 20 Balken.',
  h_axis:'Null-LDS über 0.0 … 1.0 · echte Linie bei 0.519',
  p_line:'p ≈ {b}/{n} = {p} — gezählt, nicht berechnet',
  s3_tag:'Schritt 3 · Urteil', s3_title:'Urteil in einer Zeile',
  verdict:'<b>p wird gezählt, nicht berechnet:</b> p ≈ beats / 500.',
  src:'Quelle: research/limitations_20260914.md Z. 51–60 (500-Permutationen-Verteidigung) · Z. 62–70 (Temp 0) — Auflösungsgrenze 1/500, p &lt; 0.004.',
  foot:'Eingefroren: LDS-K 0.519 / 0.933 / 0.938 · Margen +0.033…+0.424 · Boden +0.033 · 500 Permutationen · p &lt; 0.004.' },
en: { title:'Null-Slot', back:'← Gallery',
  subtitle:'Zero-model comparison — where the true value stands against 500 label permutations.',
  s1_tag:'Step 1 · true value', s1_title:'True-value ruler',
  s1_note:'Frozen LDS-K: ZH–DE 0.519, ZH–EN 0.933, DE–EN 0.938. The 59-run permutation test passes 59/59 with margins +0.033 to +0.424 (floor positive, see Step 3) — the indigo marker below is the LDS-K position, not a margin.',
  s1_floor:'Margin floor: +0.033 &gt; 0 — the value survives even its weakest margin.',
  s1_cap:'Scale 0.0 … 1.0 · indigo marker = ZH–DE 0.519 · grey ticks = 0.933 / 0.938.', m_real:'real 0.519',
  s2_tag:'Step 2 · null', s2_title:'Null histogram — 500 draws',
  s2_body:'One Run grows 500 seeded grey null draws (5 batches) into 20 bins. The indigo line at 0.519 never moves — it stands outside the null bulk. Below = more similar than chance; zero null draws beat the real line, so p is counted 0/500.',
  run:'Run (500)', reset:'Reset', draws:'draws (N/500)', beats_w:'beats the real',
  h_empty:'Press Run — 500 grey null draws will stack into 20 bins.',
  h_axis:'Null LDS over 0.0 … 1.0 · real line at 0.519',
  p_line:'p ≈ {b}/{n} = {p} — counted, not computed',
  s3_tag:'Step 3 · verdict', s3_title:'One-line verdict',
  verdict:'<b>p is counted, not computed:</b> p ≈ beats / 500.',
  src:'Source: research/limitations_20260914.md L51–60 (500-permutation defense) · L62–70 (temp 0) — resolution limit 1/500, p &lt; 0.004.',
  foot:'Frozen: LDS-K 0.519 / 0.933 / 0.938 · margins +0.033…+0.424 · floor +0.033 · 500 permutations · p &lt; 0.004.' },
zh: { title:'Null-Slot', back:'← 展厅',
  subtitle:'零模型比较——真值在 500 次标签置换面前的站位。',
  s1_tag:'第一步 · 真值', s1_title:'真值标尺',
  s1_note:'冻结 LDS-K：中文–德语 0.519，中文–英语 0.933，德语–英语 0.938。59 运行置换检验 59/59 通过，余量 +0.033 至 +0.424（下限为正，见第三步）——下方靛蓝标记是 LDS-K 位置，不是余量。',
  s1_floor:'余量下限：+0.033 &gt; 0——即使在最弱的余量下，真值依然成立。',
  s1_cap:'刻度 0.0 … 1.0 · 靛蓝标记 = 中德 0.519 · 灰色刻度 = 0.933 / 0.938。', m_real:'真值 0.519',
  s2_tag:'第二步 · 零分布', s2_title:'零直方图——500 次抽取',
  s2_body:'一次运行将 500 个种子控制的灰色零值（分 5 批）长成 20 根柱子。0.519 的靛蓝线永远不动——它站在零堆之外。在下＝比随机更相似；零个零值击败真值线，故 p 数得 0/500。',
  run:'运行（500）', reset:'重置', draws:'抽取（N/500）', beats_w:'击败真值',
  h_empty:'点击运行——500 个灰色零值将堆成 20 根柱子。',
  h_axis:'零 LDS（0.0 … 1.0）· 真线在 0.519',
  p_line:'p ≈ {b}/{n} = {p}——数出来的，不是算出来的',
  s3_tag:'第三步 · 结论', s3_title:'一句话结论',
  verdict:'<b>p 是数出来的，不是算出来的：</b>p ≈ beats / 500。',
  src:'来源：research/limitations_20260914.md 第 51–60 行（500 置换辩护）· 第 62–70 行（温度 0）——分辨率极限 1/500，p &lt; 0.004。',
  foot:'冻结值：LDS-K 0.519 / 0.933 / 0.938 · 余量 +0.033…+0.424 · 下限 +0.033 · 500 置换 · p &lt; 0.004。' }
};
var lang = 'de';
try {
  lang = localStorage.getItem('viz_lang') || localStorage.getItem('cspace_lang') || localStorage.getItem('portal_lang') || null;
  if (!lang) { var nv = (navigator.language || 'de').toLowerCase(); lang = nv.indexOf('zh') === 0 ? 'zh' : (nv.indexOf('en') === 0 ? 'en' : 'de'); }
} catch (e) { lang = 'de'; }
if (!T[lang]) lang = 'de';
function rng32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var VALS = (function () {
  var r = rng32(SEED), a = [];
  for (var i = 0; i < N; i++) {
    var g = (r() + r() + r() + r() - 2);
    var v = 0.885 + g * 0.045;
    if (v < 0.78) v = 0.78;
    if (v > 0.995) v = 0.995;
    a.push(Math.round(v * 1000) / 1000);
  }
  return a;
})();
var n = 0, beats = 0, maxC = 0, running = false;
var counts = new Array(NBINS);
for (var ci = 0; ci < NBINS; ci++) counts[ci] = 0;
var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var binsEl = document.getElementById('bins');
var binDivs = [];
for (var bi = 0; bi < NBINS; bi++) {
  var d = document.createElement('div');
  d.className = 'bin';
  binsEl.appendChild(d);
  binDivs.push(d);
}
var dotsEl = document.getElementById('dots');
var dotSpans = [];
for (var di = 0; di < N; di++) {
  var s = document.createElement('span');
  s.className = 'dot';
  dotsEl.appendChild(s);
  dotSpans.push(s);
}
function renderBins() {
  for (var i = 0; i < NBINS; i++) {
    var h = maxC > 0 ? (counts[i] / maxC * 100) : 0;
    binDivs[i].style.height = (counts[i] > 0 ? Math.max(4, h) : 0) + '%';
    binDivs[i].title = (i / NBINS).toFixed(2) + '–' + ((i + 1) / NBINS).toFixed(2) + ': ' + counts[i];
  }
}
function renderPunch() {
  var p = n > 0 ? (beats / n).toFixed(3) : '—';
  var t = T[lang].p_line.split('{b}').join(String(beats)).split('{n}').join(String(n)).split('{p}').join(p);
  document.getElementById('punch').textContent = t;
}
function renderCounts() {
  document.getElementById('nDraws').textContent = n + '/' + N;
  document.getElementById('nBeats').textContent = String(beats);
}
function addBatch(k) {
  var end = Math.min(N, n + BATCH);
  for (; n < end; n++) {
    var v = VALS[n];
    var b = Math.min(NBINS - 1, Math.floor(v * NBINS));
    counts[b]++;
    if (counts[b] > maxC) maxC = counts[b];
    if (v <= TRUE_V) beats++;
    dotSpans[n].className = 'dot on';
  }
  document.getElementById('hempty').style.display = 'none';
  renderBins();
  renderCounts();
  renderPunch();
}
function run() {
  if (running || n >= N) return;
  running = true;
  document.getElementById('run').disabled = true;
  if (reduced) {
    while (n < N) addBatch();
    running = false;
    document.getElementById('run').disabled = true;
    return;
  }
  var step = 0;
  (function next() {
    addBatch();
    step++;
    if (step < 5 && n < N) setTimeout(next, BATCH_MS);
    else { running = false; document.getElementById('run').disabled = true; }
  })();
}
function reset() {
  n = 0; beats = 0; maxC = 0; running = false;
  for (var i = 0; i < NBINS; i++) counts[i] = 0;
  for (var j = 0; j < N; j++) dotSpans[j].className = 'dot';
  document.getElementById('hempty').style.display = 'flex';
  document.getElementById('run').disabled = false;
  renderBins();
  renderCounts();
  renderPunch();
}
function setL(l) {
  lang = T[l] ? l : 'de';
  try { localStorage.setItem('viz_lang', lang); } catch (e) {}
  var t = T[lang];
  document.querySelectorAll('[data-k]').forEach(function (elm) {
    var k = elm.getAttribute('data-k');
    if (t[k] !== undefined) elm.innerHTML = t[k];
  });
  document.querySelectorAll('.nav button[data-l]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-l') === lang); });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  renderPunch();
}
document.querySelectorAll('.nav button[data-l]').forEach(function (b) {
  b.addEventListener('click', function () { setL(b.getAttribute('data-l')); });
});
document.getElementById('run').addEventListener('click', run);
document.getElementById('reset').addEventListener('click', reset);
setL(lang);
renderBins();
renderCounts();
renderPunch();
</script>
</body>
</html>
