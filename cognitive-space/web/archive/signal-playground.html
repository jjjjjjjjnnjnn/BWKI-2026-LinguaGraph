<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Playground — Lehrbuch vs. 59 Margen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --surface:#f1f3f5; --surface2:#f8fafc; --text:#0a1f3d; --text2:#4a5a78; --rule:#c6cdd6;
  --indigo:#1e3a8a; --rose:#e11d48; --candy:#f472b6; --mint:#0e7490; --amber:#b45309; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:"IBM Plex Sans","Noto Sans SC",sans-serif; background:var(--surface); color:var(--text); }
.chart { position:absolute; inset:0; overflow:auto; display:flex; flex-direction:column; align-items:flex-start; padding:170px 20px 60px; }
.chart svg { flex:0 0 auto; margin:0 auto; background:var(--surface2); border:1px solid var(--rule); border-radius:10px; box-shadow:0 18px 48px rgba(10,31,61,.10); }
.chart text { font-family:"IBM Plex Sans","Noto Sans SC",sans-serif; }
.method { flex:0 0 auto; margin:18px auto 0; width:900px; max-width:94vw; background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:8px; font-size:.62rem; color:var(--text2); }
.method summary { cursor:pointer; padding:10px 14px; font-weight:600; color:var(--indigo); }
.method .msec { padding:0 14px 10px; line-height:1.6; }
.method .msec b { color:var(--text); display:block; margin-bottom:2px; }
.method .msec + .msec { border-top:1px dashed var(--rule); padding-top:10px; }
.method .mono { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.58rem; }
.hud { position:absolute; top:16px; left:16px; z-index:10; background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:8px; padding:12px 14px; width:380px; max-width:92vw; box-shadow:0 1px 0 var(--rule),0 18px 48px rgba(10,31,61,.18); }
.hud h1 { font-family:"Playfair Display",Georgia,serif; font-weight:500; font-size:1.05rem; }
.hud h1 span { color:var(--rose); }
.hud .sub { font-size:.6rem; color:var(--text2); margin:4px 0 8px; line-height:1.55; }
.pairs { display:flex; gap:6px; margin:6px 0; }
.pairs button { flex:1; font-family:inherit; font-size:.66rem; font-weight:600; padding:7px 4px; border-radius:6px; border:1px solid var(--rule); background:#fff; color:var(--text2); cursor:pointer; }
.pairs button.active { background:var(--indigo); border-color:var(--indigo); color:#fff; }
.perm { margin-top:8px; font-size:.6rem; color:var(--text2); line-height:1.55; }
.perm input[type=range] { width:100%; accent-color:var(--rose); }
.perm .prow { display:flex; justify-content:space-between; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.58rem; }
.perm .pnote { margin-top:2px; }
.hud .row { font-size:.6rem; color:var(--text2); margin-top:4px; line-height:1.5; }
.hud .row b { color:var(--text); }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
.nav { position:absolute; top:16px; right:16px; z-index:10; display:flex; gap:6px; }
.nav a, .nav button { font-size:.62rem; color:var(--indigo); background:rgba(248,250,252,.94); border:1px solid var(--rule); border-radius:6px; padding:6px 12px; text-decoration:none; cursor:pointer; font-family:inherit; font-weight:600; }
.nav button.active { background:var(--indigo); color:#fff; border-color:var(--indigo); }
#tip { position:absolute; z-index:20; pointer-events:none; background:rgba(10,31,61,.92); color:#fff; font-size:.62rem; padding:6px 10px; border-radius:6px; display:none; line-height:1.5; max-width:260px; }
.scope { position:absolute; bottom:14px; left:16px; z-index:10; font-size:.56rem; color:var(--text2); font-family:ui-monospace,Menlo,Consolas,monospace; max-width:64vw; line-height:1.6; }
.hint { position:absolute; bottom:14px; right:16px; z-index:10; font-size:.58rem; color:var(--text2); }
</style>
</head>
<body>
<div class="chart" id="chart"></div>
<div class="hud">
  <h1>Signal <span data-k="t_play">Playground</span></h1>
  <div class="sub" data-k="sub"></div>
  <div class="pairs" id="pairs">
    <button data-p="ZH-DE" class="active">ZH-DE</button><button data-p="ZH-EN">ZH-EN</button><button data-p="DE-EN">DE-EN</button>
  </div>
  <div class="row"><span class="dot" style="background:#e11d48"></span><span data-k="lg_tb">Lehrbuch (zwischen Graphen)</span>&nbsp;&nbsp;<span class="dot" style="background:#1e3a8a"></span><span data-k="lg_ws">Within-Subject P1</span>&nbsp;&nbsp;<span class="dot" style="border:2px solid #e11d48;background:#fff"></span><span data-k="lg_w">westlich (11)</span></div>
  <div class="perm">
    <div class="prow"><span data-k="permT">Permutationen</span><span id="permVal">n = 500</span></div>
    <input type="range" id="perm" min="0" max="2" step="1" value="2" aria-label="permutations">
    <div class="prow"><span>50</span><span>100</span><span>500</span></div>
    <div class="pnote" id="permNote"></div>
  </div>
</div>
<div class="nav">
  <a href="../portal/cspace.html" data-k="back">← Galerie</a>
  <button data-l="de" class="active">DE</button><button data-l="en">EN</button><button data-l="zh">ZH</button>
</div>
<div id="tip"></div>
<div class="scope" data-k="scope"></div>
<div class="hint" data-k="hint"></div>

en: { t_play:'Playground', sub:'Textbook LDS-K (frozen: ZH-DE 0.519 · ZH-EN 0.933 · DE-EN 0.938) vs 59 within-subject margins (+0.03…+0.42, all p<0.01). Pick a pair — the strip below is always ZH-DE (P1). (file truth 62/57/186 incl. qwen-max n=26/30)',

var lang = 'de', pair = 'ZH-DE', permN = 500, prog = 0, rafId = null;
try {
  lang = localStorage.getItem('portal_lang') || localStorage.getItem('cspace_lang') || null;
  if (!lang) { var nv = (navigator.language||'en').toLowerCase(); lang = nv.indexOf('zh')===0 ? 'zh' : (nv.indexOf('de')===0 ? 'de' : 'en'); }
} catch(e) { lang = 'de'; }
if (!T[lang]) lang = 'de';
var NS = 'http://www.w3.org/2000/svg';
function el(n, a, p) { var e = document.createElementNS(NS, n); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var tip = document.getElementById('tip');
function showTip(e, h) { tip.innerHTML = h; tip.style.display = 'block'; tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY+10)+'px'; }
function hideTip() { tip.style.display = 'none'; }
function medianFmt() { return MED.toFixed(2); }
function build() {
  var box = document.getElementById('chart'); box.innerHTML = '';
  var t = T[lang], tb = TEXTBOOK[pair], isZD = (pair === 'ZH-DE');
  var W = 920, HL = 300, PW = 430, VR = 120, TOP = 18, BH = 30, GAP = 14;
  var H = TOP + 2*(BH+GAP) + 44 + (isZD ? (34 + MODELS.length*20 + 30) : 60);
  var X = function(v, max) { return HL + v/max*PW; };
  var svg = el('svg', {width: W, height: H, viewBox: '0 0 '+W+' '+H, role: 'img'}, box);
  var maxV = Math.max(tb, isZD ? MED : 0, 1.0);
  var rows = [ {n: t.tb_name, v: tb, c: '#e11d48', w: 0}, {n: t.ws_name, v: isZD ? MED : 0, c: '#1e3a8a', w: 0, na: !isZD} ];
  rows.forEach(function(r, i) {
    var y = TOP + i*(BH+GAP);

    lb.textContent = r.n;
    r.rect = el('rect', {x: HL, y: y, width: 2, height: BH, fill: r.c, rx: 5}, svg);
    r.val = el('text', {x: HL+8, y: y+20, 'font-size': 13, 'font-weight': 700, fill: '#0a1f3d'}, svg);
    r.val.textContent = r.na ? '—' : r.v.toFixed(3);
  });
  var gy = TOP + 2*(BH+GAP) + 8;
  el('line', {x1: 20, y1: gy, x2: W-20, y2: gy, stroke: '#c6cdd6', 'stroke-width': 1}, svg);
  var cap = el('text', {x: 20, y: gy+22, 'font-size': 12, 'font-weight': 600, fill: '#1e3a8a'}, svg);

    var ST = gy + 34, RH = 20, SW = 460, SL = 300;
    var SX = function(m) { return SL + m/0.45*SW; };

      var ax = SX(g);
      el('line', {x1: ax, y1: ST, x2: ax, y2: ST + MODELS.length*RH, stroke: '#dbe2ea', 'stroke-width': 1}, svg);
      var at = el('text', {x: ax, y: ST + MODELS.length*RH + 16, 'text-anchor': 'middle', 'font-size': 10, fill: '#8595ad'}, svg);
      at.textContent = '+' + g.toFixed(2);
    }
    MODELS.forEach(function(m, i) {
      var y = ST + i*RH;
      var nm = el('text', {x: SL-8, y: y+14, 'text-anchor': 'end', 'font-size': 10, fill: m[1] ? '#e11d48' : '#0a1f3d'}, svg);

      var r = el('rect', {x: SL, y: y+3, width: 2, height: 13, fill: m[1] ? '#f472b6' : '#1e3a8a',

function animate(rows, maxV, X) {
  if (rafId) cancelAnimationFrame(rafId);
  var t0 = null;
  function fr(ts) {
    if (!t0) t0 = ts;
    prog = Math.min(1, (ts-t0)/700);
    var e = 1 - Math.pow(1-prog, 3);
    rows.forEach(function(r) {
      var w = r.na ? 2 : Math.max(2, X(r.v*e, maxV) - 300);

      r.val.setAttribute('x', 300 + w + 8);
    });

        var d = Math.min(1, Math.max(0, (prog*1.4 - i/MODELS.length*0.4)));

        m._val.setAttribute('x', 300 + w + 6);
        m._val.textContent = '+' + m[2].toFixed(2);
      });
    }
    if (prog < 1) rafId = requestAnimationFrame(fr);
  }
  rafId = requestAnimationFrame(fr);
}

function applyLang() {
  var t = T[lang];
  document.querySelectorAll('[data-k]').forEach(function(n) { var k = n.getAttribute('data-k'); if (t[k] !== undefined) n.innerHTML = t[k]; });
  document.querySelectorAll('.nav button[data-l]').forEach(function(b) { b.classList.toggle('active', b.dataset.l === lang); });
  document.querySelectorAll('#pairs button').forEach(function(b) { b.classList.toggle('active', b.dataset.p === pair); });
  document.documentElement.lang = lang;
  permNote(); build();
}
document.querySelectorAll('.nav button[data-l]').forEach(function(b) {
  b.addEventListener('click', function() { lang = b.dataset.l; try { localStorage.setItem('cspace_lang', lang); } catch(e) {} applyLang(); });
});
document.querySelectorAll('#pairs button').forEach(function(b) {
  b.addEventListener('click', function() { pair = b.dataset.p; applyLang(); });
});
document.getElementById('perm').addEventListener('input', function(e) {
  permN = [50,100,500][parseInt(e.target.value,10)]; permNote();
});
applyLang();
</script>
</body>
</html>
